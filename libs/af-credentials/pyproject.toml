[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "af-credentials"
dynamic = ["version"]
description = "Backend-side client for AF Broker Identity Token verification and x509/VOMS proxy redemption"
requires-python = ">=3.12"
dependencies = [
  "pyjwt[crypto]>=2.8",
  "httpx2>=2.7.0,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[tool.hatch]
version.source = "vcs"
# Relative to this file (libs/af-credentials/), so git describe resolves
# against the monorepo root's tags -- mirrors broker/pyproject.toml.
version.raw-options.root = "../.."
# hatch-vcs never forwards a dist_name to setuptools_scm.get_version(), so
# without this, SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AF_CREDENTIALS is silently
# ignored (setuptools_scm can only match a dist-name-scoped pretend-version
# env var against a known dist_name) — only the unscoped
# SETUPTOOLS_SCM_PRETEND_VERSION would be read. Setting it here is what makes
# the packaging-safe, name-scoped variable actually take effect.
version.raw-options.dist_name = "af-credentials"
# Fallback for untagged checkouts (PRs, shallow clones without tags).
# Tagged releases always override this via git describe.
version.raw-options.fallback_version = "0.0.0"
build.hooks.vcs.version-file = "src/af_credentials/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/af_credentials"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
# Ruleset mirrors broker/pyproject.toml, adapted from
# scientific-python/cookie.
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PLC0415", # Lazy imports are deliberate (cycles, optional deps)
  "TRY003",  # Long exception messages inline — custom exception classes would be over-engineering
  "EM101",   # String literal in exception — assign-to-variable pattern adds noise, not clarity
  "EM102",   # f-string in exception — same rationale as EM101
  "ISC001",  # Conflicts with the ruff formatter (implicit string concatenation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["af_credentials"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
