[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "af-mcp-broker"
dynamic = ["version"]
description = "Credential-brokered MCP gateway for the UChicago ATLAS Analysis Facility"
requires-python = ">=3.12"
# Dependencies are managed by pixi — see pixi.toml at the workspace root.
dependencies = []

[project.scripts]
af-mcp-broker = "af_mcp_broker.__main__:main"

[tool.hatch]
version.source = "vcs"
version.raw-options.root = ".."
# hatch-vcs never forwards a dist_name to setuptools_scm.get_version(), so
# without this, SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AF_MCP_BROKER is silently
# ignored (setuptools_scm can only match a dist-name-scoped pretend-version
# env var against a known dist_name) — only the unscoped
# SETUPTOOLS_SCM_PRETEND_VERSION would be read. Setting it here is what makes
# the packaging-safe, name-scoped variable actually take effect.
version.raw-options.dist_name = "af-mcp-broker"
# Fallback for untagged checkouts (PRs, shallow clones without tags).
# Tagged releases always override this via git describe.
version.raw-options.fallback_version = "0.0.0"
build.hooks.vcs.version-file = "src/af_mcp_broker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/af_mcp_broker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
# Ruleset adapted from scientific-python/cookie
# https://github.com/scientific-python/cookie/blob/113bfd515a55969d8177b811e070b1bcd9a3dc51/%7B%7Bcookiecutter.project_name%7D%7D/pyproject.toml#L284-L338
extend-select = [
  "ARG",  # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "ERA",  # eradicate
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PLW0603", # Module-level singletons (tracer and meter providers, token-encoding cache)
  "TRY003",  # Long exception messages inline — custom exception classes would be over-engineering
  "EM101",   # String literal in exception — assign-to-variable pattern adds noise, not clarity
  "EM102",   # f-string in exception — same rationale as EM101
  "ISC001",  # Conflicts with the ruff formatter (implicit string concatenation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ARG",
  # flake8-bandit: tests assert by design; credentials and secrets are fake
  # fixtures; the fake proxy path is never touched on disk; conftest launches
  # postgres tools (initdb, pg_ctl, postgres) from the pixi env PATH; and the
  # retention test's table name is a test-controlled literal.
  "S101",
  "S105",
  "S106",
  "S107",
  "S108",
  "S603",
  "S607",
  "S608",
  # Polling helpers (`_eventually`, `_until`) take a `timeout` and loop on a
  # plain sync predicate with a short sleep inside `asyncio.timeout`; there is
  # no event to await, and the timeout bounds the wait.
  "ASYNC109",
  "ASYNC110",
  # flake8-boolean-trap: bool parameters in tests are pytest-parametrized
  # values (passed by name through the test signature) or local helper flags,
  # not a public API where a positional bool hides intent at call sites.
  "FBT001",
  "FBT002",
]
# spikes/ are exploratory validation scripts, not production code — allow
# prints, broad excepts, and other conveniences useful in scratch work.
"spikes/**" = ["ARG", "BLE", "EM", "PLR", "PTH", "T20", "TRY"]
# The /v1 and /mcp edges (and the app that wires /v1's exception handlers) are
# the only code that speaks HTTP errors; everything below raises domain errors.
"src/af_mcp_broker/app.py" = ["TID251"]
"src/af_mcp_broker/api/**" = ["TID251"]
"src/af_mcp_broker/mcp/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# One HTTP client stack: fastmcp and the mcp SDK are httpx2-only, so the broker
# shares httpx2's connection pooling, timeouts and exception hierarchy.
"httpx".msg = "use httpx2"
# Domain errors (BrokerError subclasses) are raised below the edges and
# translated to HTTP responses in app.py and the /mcp middleware.
"fastapi.HTTPException".msg = "raise a BrokerError subclass; only the api/ and mcp/ edges and app.py speak HTTP errors"
"fastapi.exceptions.HTTPException".msg = "raise a BrokerError subclass; only the api/ and mcp/ edges and app.py speak HTTP errors"
"starlette.exceptions.HTTPException".msg = "raise a BrokerError subclass; only the api/ and mcp/ edges and app.py speak HTTP errors"

[tool.ruff.lint.flake8-type-checking]
# FastAPI resolves route-handler annotations (``Annotated[Principal,
# Depends(...)]``) at runtime; with ``from __future__ import annotations`` a
# TYPE_CHECKING-only import leaves Principal unresolvable and FastAPI treats
# the parameter as a request body (422). Ruff's non-strict mode only keeps the
# import at runtime when a sibling name from the same import is used at
# runtime, which a module of its own does not have.
exempt-modules = ["typing", "af_mcp_broker.principal"]

[tool.ruff.lint.isort]
known-first-party = ["af_mcp_broker"]

[tool.pydocstyle]
# D1xx (missing docstrings) is deliberately excluded: this codebase does not
# require docstrings on every private helper, and enforcing D100-D107 would
# demand them on things like test functions and internal one-liners with no
# readability payoff. D2xx/D3xx/D4xx below are the formatting and content
# checks that catch genuine inconsistencies without that churn.
#
# D203/D211 and D212/D213 are mutually exclusive pairs (pydocstyle's own
# built-in conventions each pick one side); D211 and D212 are selected here
# because they match this codebase's existing style: no blank line before a
# class docstring, and multi-line summaries starting on the docstring's
# first line.
#
# D400 is excluded in favor of D415 (same content check for the first line's
# terminal punctuation, but D415 also accepts "?"/"!").
#
# D402 and D403 are excluded because they false-positive within this
# codebase's own conventions rather than catching real problems: D402 flags
# any docstring first line that happens to mention calling a same-named
# method on another object (this broker has several thin delegating
# wrappers, e.g. CredentialRegistry.issue() describing a call to a
# provider's issue()); D403 flags correctly-capitalized acronyms/proper
# nouns starting a line (e.g. "FastAPI"), which this domain's vocabulary
# (ATLAS, OIDC, VOMS, IAM, ...) makes likely to recur.
#
# D406-D409 are excluded because they enforce NumPy-style dashed section
# underlines; this codebase's few docstring sections (Args/Returns/Raises)
# use Google-style colons instead, and forcing the dashed-underline format
# would fight that convention rather than improve it.
select = [
  "D200", "D201", "D202", "D204", "D205", "D206", "D207", "D208", "D209",
  "D210", "D211", "D212", "D214", "D215",
  "D300", "D301",
  "D401", "D404", "D405", "D410", "D411", "D412", "D413", "D414", "D415",
  "D416", "D417", "D418", "D419",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Backstop against silent CI hangs (pytest-timeout): several tests run real
# uvicorn servers, and a wedged startup/shutdown used to stall the whole job
# with no output until GitHub Actions' 6-hour job timeout. No legitimate test
# comes anywhere near this bound; the "thread" method dumps every thread's
# stack on expiry, so a residual hang becomes a diagnosable failure.
timeout = 300
timeout_method = "thread"

[tool.importlinter]
root_package = "af_mcp_broker"
# Runtime and ``if TYPE_CHECKING:`` imports both count (import-linter's
# default): a layering that only holds at runtime still hides an inverted
# dependency. Layer names below are relative to the ``af_mcp_broker``
# container.

# Layers, highest first. A module may import from its own layer's siblings only
# where the layer uses ``:`` (none do); ``|`` marks independent siblings, which
# may not import each other directly or transitively. A module may import only
# from layers below its own. ``exhaustive`` makes a new top-level module fail
# the check until it is placed in a layer on purpose.
#
#   1. app           app builds the FastAPI app and the lifespan; token_sweep and
#                    __main__ are entry points.
#   2. wiring        the builders the lifespan calls: glue that needs several
#                    subsystems at once (a builder that needs one subsystem
#                    lives beside it).
#   3. edges         api (/v1 routers) and mcp (aggregator + ASGI/FastMCP
#                    middleware). Independent: anything both need lives below.
#   4. credentials   pat_auth resolves a broker PAT to a Principal; identity
#                    validates a Keycloak JWT (the /v1 auth dependencies live in
#                    api/auth.py).
#   5. broker_state  the typed BrokerState stored on ``app.state.broker`` and its
#                    accessors. Below identity, which reads the principal cache
#                    and dev-bypass principal from it, and above every
#                    subsystem it holds; construction stays in wiring.
#   6. features      services built on the subsystems below that the edges share:
#                    credential monitor, backend client, service status, lint
#                    observations, maintenance gate store.
#   7. registry      credential providers and the service registry.
#   8. metering      the audit pipeline above the usage store and OTel metrics,
#                    above the audit record writer.
#   9. platform      stores, caches and the entitlement policy.
#  10. settings      config and the infrastructure clients it sits beside.
#  11. leaf          types, constants and helpers with no first-party imports.
[[tool.importlinter.contracts]]
name = "Broker import layers"
type = "layers"
containers = ["af_mcp_broker"]
exhaustive = true
layers = [
  "app | token_sweep | __main__",
  "wiring",
  "api | mcp",
  "pat_auth",
  "identity",
  "broker_state",
  "credmon | backend_client | service_status | lint_observations | maintenance",
  "credentials | service_registry",
  "metering",
  "otel_metrics",
  "usage",
  "audit",
  "tracing | principal_cache | mcp_auth_codes | authorization",
  "principal_directory | token_registry",
  "config | otel_resource | vault_kv | shared_state | oauth_state | cimd_client | backend_errors",
  "errors | constants | principal | logging | metrics | _version | pat | retry_after",
]

[[tool.importlinter.contracts]]
name = "api and mcp are independent edges"
type = "independence"
modules = ["af_mcp_broker.api", "af_mcp_broker.mcp"]
