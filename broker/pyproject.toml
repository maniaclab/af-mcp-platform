[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "af-mcp-broker"
dynamic = ["version"]
description = "Credential-brokered MCP gateway for the UChicago ATLAS Analysis Facility"
requires-python = ">=3.12"
# Dependencies are managed by pixi — see pixi.toml at the workspace root.
dependencies = []

[project.scripts]
af-mcp-broker = "af_mcp_broker.__main__:main"

[tool.hatch]
version.source = "vcs"
version.raw-options.root = ".."
# hatch-vcs never forwards a dist_name to setuptools_scm.get_version(), so
# without this, SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AF_MCP_BROKER is silently
# ignored (setuptools_scm can only match a dist-name-scoped pretend-version
# env var against a known dist_name) — only the unscoped
# SETUPTOOLS_SCM_PRETEND_VERSION would be read. Setting it here is what makes
# the packaging-safe, name-scoped variable actually take effect.
version.raw-options.dist_name = "af-mcp-broker"
# Fallback for untagged checkouts (PRs, shallow clones without tags).
# Tagged releases always override this via git describe.
version.raw-options.fallback_version = "0.0.0"
build.hooks.vcs.version-file = "src/af_mcp_broker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/af_mcp_broker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
show-fixes = true
target-version = "py312"

[tool.ruff.lint]
# Ruleset adapted from scientific-python/cookie
# https://github.com/scientific-python/cookie/blob/113bfd515a55969d8177b811e070b1bcd9a3dc51/%7B%7Bcookiecutter.project_name%7D%7D/pyproject.toml#L284-L338
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PLC0415", # Lazy imports are deliberate (cycles, optional deps, lifespan)
  "PLW0603", # Module-level singletons (http client, audit logger)
  "TRY003",  # Long exception messages inline — custom exception classes would be over-engineering
  "EM101",   # String literal in exception — assign-to-variable pattern adds noise, not clarity
  "EM102",   # f-string in exception — same rationale as EM101
  "ISC001",  # Conflicts with the ruff formatter (implicit string concatenation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# spikes/ are exploratory validation scripts, not production code — allow
# prints, broad excepts, and other conveniences useful in scratch work.
"spikes/**" = ["ARG", "BLE", "EM", "PLR", "PTH", "T20", "TRY"]

[tool.ruff.lint.isort]
known-first-party = ["af_mcp_broker"]

[tool.pydocstyle]
# D1xx (missing docstrings) is deliberately excluded: this codebase does not
# require docstrings on every private helper, and enforcing D100-D107 would
# demand them on things like test functions and internal one-liners with no
# readability payoff. D2xx/D3xx/D4xx below are the formatting and content
# checks that catch genuine inconsistencies without that churn.
#
# D203/D211 and D212/D213 are mutually exclusive pairs (pydocstyle's own
# built-in conventions each pick one side); D211 and D212 are selected here
# because they match this codebase's existing style: no blank line before a
# class docstring, and multi-line summaries starting on the docstring's
# first line.
#
# D400 is excluded in favor of D415 (same content check for the first line's
# terminal punctuation, but D415 also accepts "?"/"!").
#
# D402 and D403 are excluded because they false-positive within this
# codebase's own conventions rather than catching real problems: D402 flags
# any docstring first line that happens to mention calling a same-named
# method on another object (this broker has several thin delegating
# wrappers, e.g. CredentialRegistry.issue() describing a call to a
# provider's issue()); D403 flags correctly-capitalized acronyms/proper
# nouns starting a line (e.g. "FastAPI"), which this domain's vocabulary
# (ATLAS, OIDC, VOMS, IAM, ...) makes likely to recur.
#
# D406-D409 are excluded because they enforce NumPy-style dashed section
# underlines; this codebase's few docstring sections (Args/Returns/Raises)
# use Google-style colons instead, and forcing the dashed-underline format
# would fight that convention rather than improve it.
select = [
  "D200", "D201", "D202", "D204", "D205", "D206", "D207", "D208", "D209",
  "D210", "D211", "D212", "D214", "D215",
  "D300", "D301",
  "D401", "D404", "D405", "D410", "D411", "D412", "D413", "D414", "D415",
  "D416", "D417", "D418", "D419",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
