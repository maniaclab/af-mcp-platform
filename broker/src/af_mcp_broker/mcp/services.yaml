# Default service registry. Deployed as a ConfigMap and mounted at /etc/af-mcp/services.yaml.
# Adding a service requires only a new entry here (via Helm values) — no code changes.
#
# trust_tier declares each service's Elwood v5 / Shannon posture (see
# docs/architecture.md's "Trust tiers"): service-tier for backends that front
# an external system or touch shared facility infrastructure; user-tier for a
# service that acts only with per-user credentials on the caller's own
# resources; infrastructure-tier for anything holding platform-wide secrets.
# It is a declaration only — the authoritative per-deployment assignment lives
# alongside each app's manifests in the GitOps repo (maniaclab/flux_apps#32).
services:
  - name: rucio
    prefix: rucio
    url: "http://rucio-mcp.mcp.svc.cluster.local:80/site/atlas"
    transport: http
    required_permission: read_data
    # Acts only with the caller's own forwarded per-user IAM token (never a
    # facility/shared credential), so the proxied authority is exactly the
    # user's — user-tier per the Elwood definition.
    trust_tier: user-tier
    display_name: Rucio
    description: ATLAS distributed data management — browse and query datasets, files, and replicas.
    # Model-facing policy (dual enforcement, re-review #6): guidance the agent
    # reasons over — distinct from the user-facing description above.
    agent_policy: >-
      Read-only DID, replica, and rule *queries* are safe. Creating, updating,
      or deleting replication rules changes real data placement across the
      grid — confirm the exact DID and RSE with the user before any add/update/
      delete rule call.
    # OIDCProvider returns the stored IAM-brokered token.
    # rucio-mcp handles the aud=rucio RFC 8693 exchange itself.
    auth_type: bearer
    # rucio-mcp's tools are already self-prefixed (rucio_list_dids, ...);
    # namespacing again would produce rucio_rucio_*. Safe only while a single
    # rucio site is configured -- see docs/adding-a-service.md's
    # apply_namespace section and #113 before adding a second site, since two
    # apply_namespace: false rucio entries would shadow each other's tools.
    apply_namespace: false
    # rucio-mcp serves each site's FastMCP app under /site/{site}, not a flat
    # /mcp path. Deployments override name/prefix/url per site via Helm
    # values — e.g. a second entry pointed at /site/escape for the ESCAPE VO.

  - name: ami
    prefix: ami
    url: "https://ami.cern.ch/mcp"
    transport: http
    required_permission: read_metadata
    # Acts only with the caller's own forwarded per-user x509/VOMS proxy, so
    # the proxied authority is exactly the user's — user-tier per the Elwood
    # definition.
    trust_tier: user-tier
    display_name: AMI
    description: ATLAS Metadata Interface — dataset provenance and metadata catalogs.
    agent_policy: >-
      Metadata and provenance lookups are read-only and safe to call without
      confirmation.
    # X509Provider mints a voms-proxy via the user's home-dir cert.
    auth_type: x509

  - name: atlasopenmagic
    prefix: openmagic
    url: "http://atlasopenmagic-mcp.mcp.svc.cluster.local/mcp"
    transport: http
    required_permission: read_metadata
    # Fronts external ATLAS Open Data with an AF service credential (on_behalf)
    # — shared infrastructure acted on with a facility credential.
    trust_tier: service-tier
    display_name: ATLAS Open Data
    description: Metadata and access helpers for ATLAS Open Data releases.
    agent_policy: >-
      Read-only metadata and access helpers for public Open Data — safe to
      call without confirmation.
    # ServiceProvider: on_behalf with AF service credential.
    auth_type: none

  - name: af-jupyterlab-mcp
    prefix: jlab
    url: "http://af-jupyterlab-mcp.mcp.svc.cluster.local:80/mcp"
    transport: http
    required_permission: manage_jupyter
    # Provisions and tears down shared facility compute (JupyterLab servers,
    # GPU) — interacts with shared infrastructure, not per-user read-only.
    trust_tier: service-tier
    display_name: JupyterLab
    description: Start, stop, and configure JupyterLab notebook servers on the Analysis Facility.
    agent_policy: >-
      Listing servers, images, and GPU availability is read-only. Creating or
      deleting a Jupyter server starts or stops real shared compute (and can
      claim a GPU) — confirm with the user before any create/delete call.
    # Authorization via broker-issued identity JWT (aud=af-jupyterlab-mcp); no shared secret.
    auth_type: bearer
    timeout_seconds: 120   # phase 2 nested execute calls will need this later; harmless now

  - name: af-filesystem-mcp
    prefix: fs
    apply_namespace: false
    url: "http://af-filesystem-mcp.mcp.svc.cluster.local:80/mcp"
    transport: http
    required_permission: read_files
    # Reads the caller's own home directory with the caller's own identity —
    # acts only with per-user credentials, lowest privilege.
    trust_tier: user-tier
    display_name: Filesystem
    description: Browse and read files in your Analysis Facility home directory.
    agent_policy: >-
      Reads the caller's own home directory only, and is read-only — never
      treat any path here as writable, and do not attempt to modify files.
    # af-filesystem-mcp's tools are already self-prefixed (fs_list, fs_stat,
    # fs_read, fs_grep, ...); namespacing again would produce fs_fs_*, same
    # rationale as rucio's apply_namespace: false above.
    auth_type: bearer

  - name: monitoring
    prefix: monitoring
    url: "http://grafana.prom.svc.cluster.local:3000/mcp"
    transport: http
    required_permission: read_monitoring
    # Reads shared facility monitoring (Grafana) — shared infrastructure, not
    # a per-user resource.
    trust_tier: service-tier
    display_name: Monitoring
    description: Grafana dashboards and metrics for facility monitoring.
    agent_policy: >-
      Reads shared facility dashboards and metrics — read-only, safe to call
      without confirmation.
    auth_type: none

  - name: docs
    prefix: docs
    url: "http://docs-mcp.af.svc.cluster.local/mcp"
    transport: http
    required_permission: __none__
    # Public read-only documentation, open to any authenticated caller — the
    # doc's canonical user-tier case (__none__ read-only).
    trust_tier: user-tier
    display_name: Docs
    description: Search and browse Analysis Facility documentation.
    agent_policy: >-
      Read-only documentation search and retrieval — safe to call without
      confirmation.
    auth_type: none
