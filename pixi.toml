[workspace]
name = "af-mcp-platform"
version = "0.5.4"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
# Pinned to an explicit date rather than a rolling window: fastmcp 4.2.0
# (2026-11-13) would otherwise fall outside a rolling "7d" window as soon as it
# aged out and the solver would report "no newer version" for the fastmcp pin
# below. This affects every package's solve (conda and PyPI), not just the MCP
# stack -- bump the date deliberately.
exclude-newer = "2026-11-14"

[dependencies]
python = ">=3.12,<3.13"

[feature.broker.dependencies]
# fastapi floor raised so the solver can't pick an old fastapi whose own
# starlette pin would conflict with fastmcp's starlette>=1.0.1 (fastmcp 4
# has no runtime fastapi dependency of its own -- this is solver hygiene,
# not a fastmcp requirement).
fastapi = ">=0.133"
uvicorn = ">=0.35"
pydantic = ">=2.12"
pydantic-settings = ">=2.3"
pyjwt = ">=2.8"
cryptography = ">=42"
httpx2 = ">=2.7.0,<3"
# Floor required by fastmcp-slim 4.2.0 (installed from PyPI, see below); the
# older certifi in the lock would otherwise pin the PyPI solve.
certifi = ">=2026.10.19"
structlog = ">=24.4"
# 7.x pins starlette<1.0.0, which conflicts with fastmcp's starlette>=1.0.1.
prometheus-fastapi-instrumentator = ">=8.0"
kubernetes_asyncio = ">=30.0"
pyyaml = ">=6.0"
tiktoken = ">=0.14.0"
asyncpg = ">=0.31.0,<0.32"
redis-py = ">=5.0"
opentelemetry-sdk = ">=1.44"
opentelemetry-exporter-otlp-proto-http = ">=1.44"
opentelemetry-instrumentation-fastapi = ">=0.65b0"

[feature.broker.pypi-dependencies]
# fastmcp >=4.2 wires the mcp SDK's get_tool_input_schema hook (mcp >=2.3),
# which ends the per-call tools/list fan-out (issue #333). conda-forge has
# fastmcp only up to 4.1.8, and 4.2's newer dependencies (uncalled-for 0.6.1,
# joserfc 1.8.0, openapi-pydantic 0.6.0, py-key-value-aio 0.4.6, mcp-types
# 2.3.0, ...) are also ahead of conda-forge, so the stack comes from PyPI for
# now. conda-forge/fastmcp-feedstock#70 (fastmcp v4.2.0) tracks the conda
# release: once it and the dependency feedstocks publish, move these back to
# [feature.broker.dependencies]. fastmcp's starlette>=1.0.1 requirement is
# unchanged, so the 7.x prometheus-fastapi-instrumentator pin below still holds.
fastmcp = ">=4.2.0,<5"
mcp = ">=2.3.0,<3"
# Editable install triggers hatch-vcs to generate _version.py from git tags.
af-mcp-broker = {path = "broker/", editable = true}
tokencost = ">=0.1.26, <0.2"

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
anyio = ">=4.0"
ruff = ">=0.4"
mypy = ">=1.10"
prek = "*"
tbump = ">=6.7.0"
httpx2 = ">=2.7.0,<3"
pytest-timeout = ">=2.4.0,<3"
postgresql = ">=18.4,<19"
redis-server = ">=8.0"

[feature.broker.tasks]
broker = { cmd = "uvicorn af_mcp_broker.app:app --host 0.0.0.0 --port 8080 --reload", description = "Run broker dev server" }

# ---------------------------------------------------------------------------
# Portal (Astro / Vue / Tailwind) — Node comes from conda-forge. Every task
# `cwd`s into portal/ so `pixi run -e portal dev` behaves identically to
# `cd portal && npm run dev`. Task names live only under `feature.portal` to
# avoid the nondeterministic-name-resolution issue documented above.
# ---------------------------------------------------------------------------
[feature.portal.dependencies]
nodejs = ">=20"

[feature.portal.tasks]
install = { cmd = "npm install", cwd = "portal", description = "Install portal npm dependencies", inputs = ["portal/package.json", "portal/package-lock.json"], outputs = ["portal/node_modules/.package-lock.json"] }
audit-fix = { cmd = "npm audit fix", cwd = "portal", description = "Update dependencies to resolve security vulnerabilities" }
dev = { cmd = "npm run dev", cwd = "portal", depends-on = ["install"], description = "Start portal dev server at http://localhost:4321" }
build = { cmd = "npm run build", cwd = "portal", depends-on = ["install"], description = "Build portal static site to portal/dist/", inputs = ["portal/src/**", "portal/public/**", "portal/astro.config.mjs", "portal/tsconfig.json", "portal/src/styles/**"], outputs = ["portal/dist/"] }
preview = { cmd = "npm run preview", cwd = "portal", depends-on = ["build"], description = "Serve production portal build locally" }
design-preview = { cmd = "node scripts/design-preview.mjs", cwd = "portal", depends-on = ["build"], description = "Serve portal/dist with fictional example API data for design review (--scenario, --port)" }
astro-check = { cmd = "npm run check", cwd = "portal", depends-on = ["install"], description = "Run `astro check` (types + template diagnostics)" }
format = { cmd = "npx prettier --write .", cwd = "portal", depends-on = ["install"], description = "Auto-format portal source" }
format-check = { cmd = "npx prettier --check .", cwd = "portal", depends-on = ["install"], description = "Verify portal source is prettier-formatted (CI-safe)" }
lint = { cmd = "npx eslint .", cwd = "portal", depends-on = ["install"], description = "Lint portal source with eslint-plugin-astro" }
test = { cmd = "npx vitest run", cwd = "portal", depends-on = ["install"], description = "Run portal vitest suite" }
check = { depends-on = ["format-check", "lint", "astro-check", "test"], description = "Full portal CI check: format + lint + astro check + tests" }

# Each task name must be defined in exactly one feature: pixi resolves
# duplicate names across features nondeterministically.
[feature.docs.dependencies]
zensical = "*"
lychee = "*"
pydocstyle = "*"

[feature.docs.tasks]
docs-build = { cmd = "zensical build", description = "Build documentation (static)", inputs = ["docs/", "zensical.toml"], outputs = ["site"] }
docs-linkcheck = { cmd = "lychee docs/", description = "Check documentation for broken links" }
docs-serve = { cmd = "zensical serve", depends-on = ["docs-build"], description = "Build and serve documentation" }
docs-clean = { cmd = "rm -rf site", description = "Clean documentation build artifacts", inputs = ["site"] }
check-docstrings = { cmd = "pydocstyle broker/src/af_mcp_broker/", description = "Check docstring style" }

[feature.dev.tasks]
lint = { cmd = "ruff check broker skills && ruff format --check broker skills", description = "Ruff lint + format check" }
fmt = { cmd = "ruff format broker skills && ruff check --fix broker skills", description = "Format and auto-fix broker source" }
typecheck = { cmd = "mypy broker/src skills --exclude evals/fixtures", description = "Type-check broker source and skill scripts" }
pre-commit = { cmd = "prek run --all-files", description = "Run pre-commit hooks on all files" }
lint-all = { depends-on = ["lint", "typecheck", "pre-commit"], description = "Everything the CI lint job runs" }
test = { cmd = "pytest broker/ skills/ -v", description = "Broker unit tests and skill script tests" }
test-spikes = { cmd = "pytest spikes/ -v", description = "Spike validation tests" }
# COVERAGE_CORE=sysmon: coverage.py's sys.monitoring core (PEP 669, py3.12+)
# measures line coverage with a fraction of the default C-tracer's overhead
# -- roughly halves the coverage run's test time here with byte-identical
# coverage.xml totals. Line coverage only, which is all this task collects.
test-all = { cmd = "pytest broker/ skills/ spikes/ -v --cov=af_mcp_broker --cov-report=xml --cov-report=term-missing", env = { COVERAGE_CORE = "sysmon" }, description = "All tests with coverage" }
check = { depends-on = ["lint", "typecheck", "test"], description = "Quick check: lint + typecheck + broker tests" }
check-all = { depends-on = ["lint-all", "test-all"], description = "Full check: all linting + all tests with coverage" }

# ---------------------------------------------------------------------------
# Local-dev bypass: `pixi run -e bypass broker` starts uvicorn with the auth
# bypass activated so the portal can click through without oauth2-proxy in
# front. See docs/local-development.md for the full workflow. The activation
# env is documented rather than baked into any chart / container / CI env.
# ---------------------------------------------------------------------------
[feature.bypass.activation.env]
BROKER_DEV_INSECURE_PRINCIPAL = '{"uid":1000,"gid":1000,"unixname":"devuser","email":"dev@localhost","groups":["atlas"]}'
OIDC_ISSUER = "http://localhost:8081/realms/dev"

[environments]
broker = {features = ["broker"], solve-group = "default"}
dev = {features = ["broker", "dev"], solve-group = "default"}
portal = {features = ["portal"], no-default-feature = true}
bypass = {features = ["broker", "bypass"], solve-group = "default"}
docs = {features = ["docs"], solve-group = "default"}
