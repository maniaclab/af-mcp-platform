# Exercises the tracing template paths (OTEL_EXPORTER_OTLP_ENDPOINT, the
# parentbased_traceidratio sampler pair, and the NetworkPolicy egress rule to
# the collector) so a broken render is caught by CI's `ct lint`, which lints
# the chart once per values file in this directory. Placeholder example.com
# values, same caveats as test-values.yaml; no collector needs to exist for
# linting -- the broker is an emitter only.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  # Two replicas (the chart default) need a shared state store or an explicit
  # opt-in; this file is not about shared state, so it opts in.
  sharedState:
    allowPerReplicaState: true
  otlp:
    endpoint: "http://otel-collector.observability:4318"
    networkPolicy:
      namespaceSelector:
        kubernetes.io/metadata.name: "observability"
      podSelector:
        app.kubernetes.io/name: "opentelemetry-collector"
      port: 4318
  tracing:
    enabled: true
    sampleRatio: "0.25"
