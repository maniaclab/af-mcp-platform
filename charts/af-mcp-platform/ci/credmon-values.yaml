# Exercises the HTCondor credmon storer rendering (docs/credmon.md): the
# CREDMON_* env, the htcondor-api token Secret mount, and the stale-sync
# PrometheusRule. `ct lint`/`helm template` only prove this renders; the
# content assertion is a separate `helm template | grep` step in
# chart-lint.yaml.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  # The broker refuses to start without its Keycloak admin service account.
  keycloakAdmin:
    clientId: "example-keycloak-admin-client"
    existingClientSecretSecret: "example-keycloak-admin-client-secret"
  vault:
    kvRoot: "mcp"
  # Two replicas (the chart default) need a shared state store or an explicit
  # opt-in; this file is not about shared state, so it opts in.
  sharedState:
    allowPerReplicaState: true
  identityToken:
    existingSigningKeySecret: "example-broker-signing-key"
  identityProviders:
    - type: krb5-token
      alias: krb5-example
      targets: ["example_krb5_service"]
      serviceUrl: "http://krb5-token-service.example.svc.cluster.local:8080"
      displayName: "CERN Kerberos ticket (example)"
  oauth21:
    tokenStore:
      vault:
        addr: "https://vault.example.com"
        authRole: "af-mcp-broker-example"
  credmon:
    enabled: true
    htcondorApiUrl: "http://condor-mcp.example.svc.cluster.local:8080"
    userDomain: "example.org"
    existingHtcondorApiTokenSecret: "example-credmon-htcondor-api-token"
    kinds: ["krb5"]
    syncIntervalSeconds: "14400"
    prometheusRule:
      enabled: true

# values.schema.json requires a non-empty service registry and group map.
aggregator:
  services:
    - name: docs-example
      prefix: docs
      url: "http://docs-mcp.example.svc.cluster.local/mcp"
      transport: http
      required_permission: __none__
entitlements:
  group_permissions:
    __authenticated__: [read_metadata]

# An enabled Ingress needs both hostnames (values.schema.json).
ingress:
  mcpHost: "mcp.example.com"
  portalHost: "mcp-portal.example.com"

# Every in-cluster URL needs the pods behind it (networkPolicy.endpoints).
networkPolicy:
  egress:
    endpoints:
      condor-mcp.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: condor-mcp
      docs-mcp.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: docs-mcp
      krb5-token-service.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: krb5-token-service
