# Exercises the OTel-usage-events-only template paths (USAGE_EVENTS_OTLP_ENABLED,
# the shared OTEL_EXPORTER_OTLP_ENDPOINT without tracing switched on, and the
# shared NetworkPolicy egress rule to the collector) so a broken render is
# caught by CI's `ct lint`, which lints the chart once per values file in this
# directory. Placeholder example.com values, same caveats as test-values.yaml;
# no collector needs to exist for linting -- the broker is an emitter only.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  # The broker refuses to start without its Keycloak admin service account.
  keycloakAdmin:
    clientId: "example-keycloak-admin-client"
    existingClientSecretSecret: "example-keycloak-admin-client-secret"
  # Two replicas (the chart default) need a shared state store or an explicit
  # opt-in; this file is not about shared state, so it opts in.
  sharedState:
    allowPerReplicaState: true
  usageEvents:
    otlp:
      enabled: true
  # Tracing stays disabled: the collector endpoint and NetworkPolicy shape are
  # shared with it, and usage events must not switch tracing on.
  otlp:
    endpoint: "http://otel-collector.observability.svc:4318"

# Narrows the generated egress rule to the collector's pods.
networkPolicy:
  egress:
    endpoints:
      docs-mcp.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: docs-mcp
      otel-collector.observability.svc:
        podSelector:
          app.kubernetes.io/name: "opentelemetry-collector"

# values.schema.json requires a non-empty service registry and group map.
aggregator:
  services:
    - name: docs-example
      prefix: docs
      url: "http://docs-mcp.example.svc.cluster.local/mcp"
      transport: http
      required_permission: __none__
entitlements:
  group_permissions:
    __authenticated__: [read_metadata]

# An enabled Ingress needs both hostnames (values.schema.json).
ingress:
  mcpHost: "mcp.example.com"
  portalHost: "mcp-portal.example.com"
