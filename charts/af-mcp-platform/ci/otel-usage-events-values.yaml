# Exercises the OTel-usage-events-only template paths (USAGE_EVENTS_OTLP_ENABLED,
# the per-signal OTEL_EXPORTER_OTLP_LOGS_ENDPOINT used when tracing is off, and
# the shared NetworkPolicy egress rule to the collector) so a broken render is
# caught by CI's `ct lint`, which lints the chart once per values file in this
# directory. Placeholder example.com values, same caveats as test-values.yaml;
# no collector needs to exist for linting -- the broker is an emitter only.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  # Two replicas (the chart default) need a shared state store or an explicit
  # opt-in; this file is not about shared state, so it opts in.
  sharedState:
    allowPerReplicaState: true
  usageEvents:
    otlp:
      enabled: true
  # Tracing stays disabled: the collector endpoint and NetworkPolicy shape are
  # shared with it, and usage events must not switch tracing on.
  tracing:
    endpoint: "http://otel-collector.observability:4318"
    networkPolicy:
      namespaceSelector:
        kubernetes.io/metadata.name: "observability"
      podSelector:
        app.kubernetes.io/name: "opentelemetry-collector"
      port: 4318
