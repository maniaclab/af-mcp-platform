# Vault-backed maintenance mode as the ONLY Vault consumer (tokenStore,
# tokenRegistry and principalCache stay in-memory, no krb5/x509/servicex
# provider), plus an oauth21-direct entry with a revocation endpoint. Used by
# check-vault-rendering.sh; see that script for what it asserts.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  vault:
    kvRoot: "mcp"
  sharedState:
    allowPerReplicaState: true
  identityProviders:
    - type: oauth21-direct
      alias: rucio-mcp-example
      targets: ["rucio-mcp-example"]
      authorizationEndpoint: "https://rucio-mcp.example.com/authorize"
      tokenEndpoint: "https://rucio-mcp.example.com/token"
      revocationEndpoint: "https://rucio-mcp.example.com/revoke"
      issuer: "https://rucio-mcp.example.com"
  maintenanceMode:
    backend: vault
  oauth21:
    tokenStore:
      vault:
        addr: "https://vault.example.com"
        authRole: "af-mcp-broker-example"

# values.schema.json requires a non-empty service registry and group map.
aggregator:
  services:
    - name: docs-example
      prefix: docs
      url: "http://docs-mcp.example.svc.cluster.local/mcp"
      transport: http
      required_permission: __none__
entitlements:
  group_permissions:
    __authenticated__: [read_metadata]

# An enabled Ingress needs both hostnames (values.schema.json).
ingress:
  mcpHost: "mcp.example.com"
  portalHost: "mcp-portal.example.com"

# Every in-cluster URL needs the pods behind it (networkPolicy.endpoints).
networkPolicy:
  egress:
    endpoints:
      docs-mcp.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: docs-mcp
