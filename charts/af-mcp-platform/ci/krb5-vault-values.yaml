# Exercises the "krb5-token identityProviders entry implies Vault" gap
# (af-mcp-platform.identityProvidersNeedVault in _helpers.tpl) in isolation:
# ONLY a krb5-token entry is configured, with none of
# oauth21.tokenStore.backend/tokenRegistry.backend/principalCache.backend
# set to "vault". test-values.yaml can't catch a regression of this gating
# by itself -- it also sets those three backends to "vault" for their own
# template-path coverage, so VAULT_ADDR would render there regardless of
# whether the krb5-token/x509-service-mode gating is correct. `ct lint` and
# `helm template` against this values file only confirm the chart is valid
# Go-template/schema and renders without erroring for this shape of values
# -- neither one asserts that VAULT_ADDR (or any other specific env var)
# actually appears in the rendered output. That content assertion is a
# separate `helm template | grep` step in chart-lint.yaml.
oidc:
  issuer: "https://keycloak.example.com/realms/example"
portal:
  oidc:
    clientId: "example-portal-client"
    scope: "openid profile email example-audience"
  brokerOrigin: "https://mcp.example.com"

broker:
  # Two replicas (the chart default) need a shared state store or an explicit
  # opt-in; this file is not about shared state, so it opts in.
  sharedState:
    allowPerReplicaState: true
  identityProviders:
    - type: krb5-token
      alias: krb5-example
      targets: []
      serviceUrl: "http://krb5-token-service.example.svc.cluster.local:8080"
      displayName: "CERN Kerberos ticket (example)"
      enables: "Example Kerberos-authenticated access"
  oauth21:
    tokenStore:
      vault:
        addr: "https://vault.example.com"
        authRole: "af-mcp-broker-example"

# values.schema.json requires a non-empty service registry and group map.
aggregator:
  services:
    - name: docs-example
      prefix: docs
      url: "http://docs-mcp.example.svc.cluster.local/mcp"
      transport: http
      required_permission: __none__
entitlements:
  group_permissions:
    __authenticated__: [read_metadata]

# An enabled Ingress needs both hostnames (values.schema.json).
ingress:
  mcpHost: "mcp.example.com"
  portalHost: "mcp-portal.example.com"

# Every in-cluster URL needs the pods behind it (networkPolicy.endpoints).
networkPolicy:
  egress:
    endpoints:
      docs-mcp.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: docs-mcp
      krb5-token-service.example.svc.cluster.local:
        podSelector:
          app.kubernetes.io/name: krb5-token-service
