# Facility-specific values of the UChicago ATLAS Analysis Facility reference
# deployment: the values the chart deliberately has no default for. Layer your
# own file over the chart the same way (`helm install -f <your-values>.yaml`);
# every key below is a fact about one facility's cluster or Keycloak realm.
# It is not a complete values file: the realm's client ids and Secret names,
# the service registry (aggregator.services) and identity providers are
# deployment-specific too.

# Keycloak realm shared by the broker and the portal.
oidc:
  issuer: "https://auth.af.uchicago.edu/realms/connect"

ingress:
  mcpHost: mcp.af.uchicago.edu
  portalHost: mcp-portal.af.uchicago.edu
  annotations:
    # The cluster's cert-manager ClusterIssuer.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    # cert-manager writes the certificates into these Secrets; leaving them
    # empty derives "<fullname>-mcp-tls" and "<fullname>-portal-tls".
    mcpSecretName: letsencrypt-generated-af-mcp
    portalSecretName: letsencrypt-generated-af-mcp-portal

# The cluster runs the Prometheus Operator and a Grafana whose sidecar watches
# the `prom` namespace.
serviceMonitor:
  enabled: true
grafanaDashboard:
  enabled: true
  namespace: prom

# Keycloak group names of the UChicago AF's realm. Group names come from the
# deployer's own realm, so another facility writes its own mapping; see
# docs/auth.md's "Group-to-Permission Mapping Example".
entitlements:
  group_permissions:
    atlas: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, manage_jupyter, read_files]
    cms: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, read_files]
    dune: [read_data, read_metadata, submit_jobs, manage_jobs, launch_compute, read_files]
    escape: [read_data, read_metadata, read_files]
    af-admins: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_data, admin, read_files]
    # Any authenticated user, no group membership required.
    __authenticated__: [read_metadata, read_monitoring]

broker:
  # Keycloak group whose members administer the broker.
  adminGroup: /connect/uchicago/admin
