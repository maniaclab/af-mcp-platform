apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-services
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
data:
  services.yaml: |
    # FastMCP aggregator service registry.
    # Each entry is a ServiceSpec; the broker mounts this at /etc/af-mcp/services.yaml.
    services:
    {{- if .Values.aggregator.services }}
      {{- toYaml .Values.aggregator.services | nindent 4 }}
    {{- else }}
      [] # No services configured; set aggregator.services in your values overlay.
    {{- end }}
