apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-policy
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # AF MCP Platform entitlements policy.
    # Mounted at /etc/af-mcp/policy.yaml in the broker container.
    # Override any section via values.entitlements.* in your overlay.

    # Keycloak group -> allowed broker capabilities. Group names are
    # inherently site-specific (they come from the deployer's own Keycloak
    # realm), so this chart ships no site-specific defaults -- set
    # entitlements.group_capabilities in your overlay. See docs/auth.md's
    # "Group-to-Capability Mapping Example" for a copyable ATLAS AF worked
    # example. Deploying without any override means no user can reach a
    # backend whose `required_capability` (backends.yaml) isn't __none__ --
    # the broker logs a loud startup error naming each such backend.
    group_capabilities:
    {{- if .Values.entitlements.group_capabilities }}
      {{- toYaml .Values.entitlements.group_capabilities | nindent 6 }}
    {{- else }}
      # Any authenticated user (no group membership required) -- the one
      # entry that isn't site-specific, so it's the only built-in default.
      __authenticated__: [read_metadata, read_monitoring]
    {{- end }}

    # Which capability is required to use each backend target is declared by
    # `required_capability` in backends.yaml, not here -- backends.yaml is
    # the sole source of truth for that mapping (see issue #60).

    # Action type overrides per backend (tool glob pattern -> action type).
    # Anything not listed defaults to "read".
    target_action_types:
    {{- if .Values.entitlements.target_action_types }}
      {{- toYaml .Values.entitlements.target_action_types | nindent 6 }}
    {{- else }}
      panda:
        "submit_*": state_change
        "cancel_*": state_change
        "delete_*": state_change
        "kill_*": state_change
      condor:
        "submit_*": state_change
        "rm_*": state_change
        "hold_*": state_change
        "release_*": state_change
      gitlab:
        "create_*": state_change
        "update_*": state_change
        "merge_*": state_change
        "retry_*": state_change
        "close_*": state_change
        "delete_*": state_change
      jupyter-control:
        "*": state_change
    {{- end }}
