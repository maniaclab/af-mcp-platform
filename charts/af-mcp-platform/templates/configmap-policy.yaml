apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-policy
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # AF MCP Platform entitlements policy.
    # Mounted at /etc/af-mcp/policy.yaml in the broker container.
    # Override any section via values.entitlements.* in your overlay.

    # Keycloak group -> allowed broker capabilities. The default below (used
    # when entitlements.group_capabilities is unset) is the UChicago ATLAS
    # AF's own Keycloak group names -- a working convenience for that one
    # deployment, and a template for what an overlay looks like, NOT a
    # generic default. Group names are inherently site-specific (they come
    # from the deployer's own Keycloak realm), so any OTHER analysis facility
    # MUST set entitlements.group_capabilities in its own overlay with its
    # own group names -- see values.yaml's entitlements.group_capabilities
    # comment and docs/auth.md's "Group-to-Capability Mapping Example" for a
    # non-ATLAS worked example. Deploying unmodified against a realm without
    # these exact group names means no user can reach a backend whose
    # `required_capability` (backends.yaml) isn't __none__ -- the broker
    # refuses to start, naming each such backend and capability (issue #125).
    group_capabilities:
    {{- if .Values.entitlements.group_capabilities }}
      {{- toYaml .Values.entitlements.group_capabilities | nindent 6 }}
    {{- else }}
      # UChicago ATLAS AF default -- see the comment above before relying on
      # this for any other site.
      atlas: [read_data, read_metadata, read_monitoring, read_gitlab, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_gitlab, read_files]
      cms: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, read_files]
      dune: [read_data, read_metadata, submit_jobs, manage_jobs, launch_compute, read_files]
      escape: [read_data, read_metadata, read_files]
      af-admins: [read_data, read_metadata, read_monitoring, read_gitlab, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_gitlab, manage_data, admin, read_files]
      # Any authenticated user (no group membership required) -- the one
      # entry that isn't site-specific.
      __authenticated__: [read_metadata, read_monitoring]
    {{- end }}

    # Which capability is required to use each backend target is declared by
    # `required_capability` in backends.yaml, not here -- backends.yaml is
    # the sole source of truth for that mapping (see issue #60).

    # Action type overrides per backend (tool glob pattern -> action type).
    # Anything not listed defaults to "read".
    target_action_types:
    {{- if .Values.entitlements.target_action_types }}
      {{- toYaml .Values.entitlements.target_action_types | nindent 6 }}
    {{- else }}
      panda:
        "submit_*": state_change
        "cancel_*": state_change
        "delete_*": state_change
        "kill_*": state_change
      condor:
        "submit_*": state_change
        "rm_*": state_change
        "hold_*": state_change
        "release_*": state_change
      gitlab:
        "create_*": state_change
        "update_*": state_change
        "merge_*": state_change
        "retry_*": state_change
        "close_*": state_change
        "delete_*": state_change
      af-jupyterlab-mcp:
        "create_*": state_change
        "delete_*": state_change
    {{- end }}
