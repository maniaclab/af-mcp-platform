apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-policy
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # AF MCP Platform entitlements policy.
    # Mounted at /etc/af-mcp/policy.yaml in the broker container.
    # Override any section via values.entitlements.* in your overlay.

    # ATLAS IAM group -> allowed broker capabilities.
    # Built-in defaults cover standard ATLAS analysis groups.
    group_capabilities:
    {{- if .Values.entitlements.group_capabilities }}
      {{- toYaml .Values.entitlements.group_capabilities | nindent 6 }}
    {{- else }}
      # Full ATLAS analysis + compute + GitLab access.
      atlas: [read_data, read_metadata, read_monitoring, read_gitlab, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_gitlab]
      # Analysis + compute access, no GitLab/Jupyter management.
      cms: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute]
      # Analysis + compute access, no monitoring dashboards.
      dune: [read_data, read_metadata, submit_jobs, manage_jobs, launch_compute]
      # Read-only data + metadata access.
      escape: [read_data, read_metadata]
      # Full access plus data management and platform administration.
      af-admins: [read_data, read_metadata, read_monitoring, read_gitlab, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_gitlab, manage_data, admin]
      # Any authenticated user (no group membership required)
      __authenticated__: [read_metadata, read_monitoring]
    {{- end }}

    # Which capability is required to use each backend target.
    # "__none__" means open to any authenticated user.
    target_capabilities:
    {{- if .Values.entitlements.target_capabilities }}
      {{- toYaml .Values.entitlements.target_capabilities | nindent 6 }}
    {{- else }}
      rucio: read_data
      ami: read_metadata
      atlasopenmagic: read_metadata
      panda: submit_jobs
      condor: submit_jobs
      gitlab: read_gitlab
      jupyter-control: manage_jupyter
      monitoring: read_monitoring
      docs: __none__
    {{- end }}

    # Action type overrides per backend (tool glob pattern -> action type).
    # Anything not listed defaults to "read".
    target_action_types:
    {{- if .Values.entitlements.target_action_types }}
      {{- toYaml .Values.entitlements.target_action_types | nindent 6 }}
    {{- else }}
      panda:
        "submit_*": state_change
        "cancel_*": state_change
        "delete_*": state_change
        "kill_*": state_change
      condor:
        "submit_*": state_change
        "rm_*": state_change
        "hold_*": state_change
        "release_*": state_change
      gitlab:
        "create_*": state_change
        "update_*": state_change
        "merge_*": state_change
        "retry_*": state_change
        "close_*": state_change
        "delete_*": state_change
      jupyter-control:
        "*": state_change
    {{- end }}
