apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-policy
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # AF MCP Platform entitlements policy.
    # Mounted at /etc/af-mcp/policy.yaml in the broker container.
    # Override any section via values.entitlements.* in your overlay.

    # Keycloak group -> allowed broker permissions. The default below (used
    # when entitlements.group_permissions is unset) is the UChicago ATLAS
    # AF's own Keycloak group names -- a working convenience for that one
    # deployment, and a template for what an overlay looks like, NOT a
    # generic default. Group names are inherently site-specific (they come
    # from the deployer's own Keycloak realm), so any OTHER analysis facility
    # MUST set entitlements.group_permissions in its own overlay with its
    # own group names -- see values.yaml's entitlements.group_permissions
    # comment and docs/auth.md's "Group-to-Permission Mapping Example" for a
    # non-ATLAS worked example. Deploying unmodified against a realm without
    # these exact group names means no user can reach a service whose
    # `required_permission` (services.yaml) isn't __none__ -- the broker
    # refuses to start, naming each such service and permission (issue #125).
    group_permissions:
    {{- if .Values.entitlements.group_permissions }}
      {{- toYaml .Values.entitlements.group_permissions | nindent 6 }}
    {{- else }}
      # UChicago ATLAS AF default -- see the comment above before relying on
      # this for any other site.
      atlas: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, manage_jupyter, read_files]
      cms: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, read_files]
      dune: [read_data, read_metadata, submit_jobs, manage_jobs, launch_compute, read_files]
      escape: [read_data, read_metadata, read_files]
      af-admins: [read_data, read_metadata, read_monitoring, submit_jobs, manage_jobs, launch_compute, manage_jupyter, manage_data, admin, read_files]
      # Any authenticated user (no group membership required) -- the one
      # entry that isn't site-specific.
      __authenticated__: [read_metadata, read_monitoring]
    {{- end }}

    # Which permission is required to use each service target is declared by
    # `required_permission` in services.yaml, not here -- services.yaml is
    # the sole source of truth for that mapping (see issue #60).

    # Site-defined permissions (name -> read|state_change) that a
    # `required_permission` in services.yaml uses but the broker doesn't
    # ship. The broker refuses to start if a service requires a permission
    # that is neither built-in nor listed here. Remember to also grant it
    # to a group in group_permissions.
    custom_permissions:
    {{- if .Values.entitlements.custom_permissions }}
      {{- toYaml .Values.entitlements.custom_permissions | nindent 6 }}
    {{- else }} {}
    {{- end }}

    # Action type overrides per service (tool glob pattern -> action type).
    # Keys are service names (services.yaml `name`); globs match the wire
    # (prefixed) tool name a caller sees. Anything not listed resolves from
    # the service's required_permission. No default: the chart ships no
    # services, so any default key would match nothing.
    target_action_types:
    {{- if .Values.entitlements.target_action_types }}
      {{- toYaml .Values.entitlements.target_action_types | nindent 6 }}
    {{- else }} {}
    {{- end }}
