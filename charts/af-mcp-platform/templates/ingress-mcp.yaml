{{- if .Values.ingress.enabled }}
# This Ingress carries no auth gate of its own. The broker owns JWT
# validation for mcpHost directly (see identity.py's keycloak_dependency) —
# an earlier design routed this host through a shared oauth2-proxy
# ForwardAuth gate, which 302'd every Bearer request instead of passing it
# through, because oauth2-proxy's keycloak-oidc provider validates `aud`
# against its own client_id, not the broker's expected audience. Verified
# live in #26; settled architecture in #42.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-mcp
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.mcpHost | quote }}
      secretName: {{ .Values.ingress.tls.mcpSecretName | quote }}
  {{- end }}
  rules:
    # Broker host — routes /v1 (REST API, including the MCP OAuth bootstrap
    # flow's /v1/oauth/authorize and /v1/oauth/token, issue #140), /mcp
    # (FastMCP aggregator), and the broker's well-known discovery documents:
    # /.well-known/cimd (Client ID Metadata Document, public, unauthenticated,
    # used when the broker acts as a *client* of a backend AS) plus the RFC
    # 9728 protected-resource metadata (both the root and /mcp-suffixed
    # forms an MCP client tries) and RFC 8414 authorization-server metadata
    # naming the broker itself as the authorization server for MCP clients,
    # plus /.well-known/jwks.json (issue #162: the AF Broker Identity Token
    # issuer's public keys, fetched by AF-native backends like
    # condor-token-service to verify broker-signed identity assertions).
    # Everything else under /.well-known hits nginx's default HTML 404 --
    # exactly the confusing failure reported in #140 before these existed.
    - host: {{ .Values.ingress.mcpHost | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /.well-known/cimd
            pathType: Exact
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource/mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: {{ include "af-mcp-platform.broker.fullname" . }}
                port:
                  name: http
{{- end }}
