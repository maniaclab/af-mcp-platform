{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $ingress := .Values.networkPolicy.ingress }}
{{- $ipv4 := has "IPv4" .Values.networkPolicy.ipFamilies }}
{{- $ipv6 := has "IPv6" .Values.networkPolicy.ipFamilies }}
# Deny all ingress to the broker except from networkPolicy.ingress.broker, the
# in-cluster JWKS clients (unless networkPolicy.ingress.broker.jwks.generate is
# false) and the chart's own helm-test pod.
# Deny all egress from the broker except: DNS, networkPolicy.egress.extraEgress
# and, unless networkPolicy.egress.generate is false, the public internet on
# the ports of its external URLs, every in-cluster URL in the values (see
# _networkpolicy.tpl), and the stores declared under broker.usage.postgres and
# broker.sharedState.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "af-mcp-platform.broker.fullname" . }}
  labels:
    {{- include "af-mcp-platform.broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "af-mcp-platform.broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- include "af-mcp-platform.netpol.sources" $ingress.broker.sources | nindent 4 }}
    # Allow the chart's own helm-test pod (same namespace) to hit the broker.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: 8080
    {{- if $ingress.broker.jwks.generate }}
    {{- $clients := include "af-mcp-platform.netpol.targets" (dict "root" . "urls" (include "af-mcp-platform.netpol.jwksClientUrls" . | fromJsonArray)) | fromJson }}
    {{- if $clients.hosts }}
    # JWKS clients: the in-cluster token services and the backends that
    # verify a broker-issued token fetch the broker's /.well-known/jwks.json
    # on its API port. One peer per host,
    # selecting the pods behind it (networkPolicy.egress.endpoints). An empty
    # `from` would allow every source, so no rule renders without a client.
    - from:
        {{- range $host, $target := $clients.hosts }}
        # {{ $host }}
        - {{ include "af-mcp-platform.netpol.peer" $target | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- end }}
    {{- with $ingress.broker.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # DNS — required for all outbound name resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    {{- if $egress.generate }}
    {{- $targets := include "af-mcp-platform.netpol.targets" (dict "root" . "urls" (include "af-mcp-platform.netpol.urls" . | fromJsonArray)) | fromJson }}
    # External URLs (an external OIDC issuer, an identity provider's token
    # endpoint, a CIMD client metadata document, ...). A NetworkPolicy cannot
    # select a DNS name and the destination IPs of external providers are not
    # stable, so every external host shares this rule: any public address on
    # the port of each external URL (443 and, e.g., 8443 for
    # https://host:8443). Restrict it further with an egress FQDN policy
    # (e.g., Cilium NetworkPolicy or an external firewall rule).
    # Pods are dual-stack, so the rule has one ipBlock per family in
    # networkPolicy.ipFamilies: IPv6 egress not listed here is dropped, and
    # clients that try IPv6 first stall until they fall back. Private (RFC-1918 / ULA), link-local and cloud-metadata
    # addresses are excluded, plus networkPolicy.egress.external.exceptCidrs.
    - to:
        {{- if $ipv4 }}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "af-mcp-platform.netpol.exceptCidrs" (dict "family" "4" "root" .) | fromJsonArray | toYaml | nindent 14 }}
        {{- end }}
        {{- if $ipv6 }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- include "af-mcp-platform.netpol.exceptCidrs" (dict "family" "6" "root" .) | fromJsonArray | toYaml | nindent 14 }}
        {{- end }}
      ports:
        {{- range $targets.publicPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}

    # In-cluster URLs (aggregator services, Vault, in-cluster Keycloak, token
    # services, the OTLP collector, ...): one rule per host, pairing the
    # host's namespace with the pods behind it (networkPolicy.egress.endpoints) on the
    # URL's port or the endpoint's targetPort.
    {{- range $host, $target := $targets.hosts }}
    # {{ $host }}
    - to:
        - {{ include "af-mcp-platform.netpol.peer" $target | nindent 10 | trim }}
      ports:
        {{- range $port := keys $target.ports | sortAlpha }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}

    # Postgres usage store (broker.usage.backend="postgres") -- the URL is in a
    # Secret, so the pods are declared in broker.usage.postgres.networkPolicy.
    {{- if eq .Values.broker.usage.backend "postgres" }}
    {{- $postgres := .Values.broker.usage.postgres.networkPolicy }}
    - to:
        - {{ include "af-mcp-platform.netpol.storePeer" (dict "policy" $postgres "path" "broker.usage.postgres.networkPolicy" "root" .) | nindent 10 | trim }}
      ports:
        - protocol: TCP
          port: {{ $postgres.port }}
    {{- end }}

    # Shared cross-replica state store (broker.sharedState) -- the URL is in a
    # Secret, so the store is declared in broker.sharedState.networkPolicy: an
    # ipBlock when `cidr` is set (managed instance outside the cluster),
    # otherwise a namespace and pod selector.
    {{- if include "af-mcp-platform.sharedState.configured" . }}
    {{- $store := .Values.broker.sharedState.networkPolicy }}
    - to:
        {{- if $store.cidr }}
        {{- if not (has (ternary "IPv6" "IPv4" (contains ":" $store.cidr)) .Values.networkPolicy.ipFamilies) }}
        {{- fail (printf "broker.sharedState.networkPolicy.cidr %s is in an address family missing from networkPolicy.ipFamilies" $store.cidr) }}
        {{- end }}
        - ipBlock:
            cidr: {{ $store.cidr | quote }}
        {{- else }}
        - {{ include "af-mcp-platform.netpol.storePeer" (dict "policy" $store "path" "broker.sharedState.networkPolicy" "root" .) | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $store.port }}
    {{- end }}
    {{- end }}

    # Anything else the broker must reach (networkPolicy.egress.extraEgress).
    {{- with $egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Portal network policy: allow ingress from networkPolicy.ingress.portal; no
# egress rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "af-mcp-platform.portal.fullname" . }}
  labels:
    {{- include "af-mcp-platform.portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "af-mcp-platform.portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or $ingress.portal.sources $ingress.portal.extraIngress }}
  ingress:
    {{- include "af-mcp-platform.netpol.sources" $ingress.portal.sources | nindent 4 }}
    {{- with $ingress.portal.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
