{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $ingress := .Values.networkPolicy.ingress }}
{{- $ipv4 := has "IPv4" .Values.networkPolicy.ipFamilies }}
{{- $ipv6 := has "IPv6" .Values.networkPolicy.ipFamilies }}
# Deny all ingress to the broker except from networkPolicy.ingress.broker
# (and the chart's own helm-test pod).
# Deny all egress from the broker except: DNS, networkPolicy.egress.extraEgress
# and, unless networkPolicy.egress.generate is false, the public internet on
# the ports of its external URLs, every in-cluster URL in the values (see
# _networkpolicy.tpl), and the stores selected under broker.usage.postgres and
# broker.sharedState.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "af-mcp-platform.broker.fullname" . }}
  labels:
    {{- include "af-mcp-platform.broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "af-mcp-platform.broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- include "af-mcp-platform.netpol.sources" $ingress.broker.sources | nindent 4 }}
    # Allow the chart's own helm-test pod (same namespace) to hit the broker.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: 8080
    {{- with $ingress.broker.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # DNS — required for all outbound name resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    {{- if $egress.generate }}
    {{- $targets := include "af-mcp-platform.netpol.targets" . | fromJson }}
    # External URLs (an external OIDC issuer, an identity provider's token
    # endpoint, a CIMD client metadata document, ...). A NetworkPolicy cannot
    # select a DNS name and the destination IPs of external providers are not
    # stable, so every external host shares this rule: any public address on
    # the port of each external URL (443 and, e.g., 8443 for
    # https://host:8443). Restrict it further with an egress FQDN policy
    # (e.g., Cilium NetworkPolicy or an external firewall rule).
    # Pods are dual-stack, so the rule has one ipBlock per family in
    # networkPolicy.ipFamilies: IPv6 egress not listed here is dropped, and
    # clients that try IPv6 first stall until they fall back. Private (RFC-1918 / ULA), link-local and cloud-metadata
    # addresses are excluded, plus networkPolicy.egress.external.exceptCidrs.
    - to:
        {{- if $ipv4 }}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "af-mcp-platform.netpol.exceptCidrs" (dict "family" "4" "root" .) | fromJsonArray | toYaml | nindent 14 }}
        {{- end }}
        {{- if $ipv6 }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- include "af-mcp-platform.netpol.exceptCidrs" (dict "family" "6" "root" .) | fromJsonArray | toYaml | nindent 14 }}
        {{- end }}
      ports:
        {{- range $targets.publicPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}

    # In-cluster URLs (aggregator services, Vault, in-cluster Keycloak, token
    # services, the OTLP collector, ...): one rule per host, pairing the
    # host's namespace with the pods behind it (networkPolicy.egress.endpoints) on the
    # URL's port or the endpoint's targetPort.
    {{- range $host, $target := $targets.hosts }}
    # {{ $host }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $target.namespace | quote }}
          {{- if $target.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml $target.podSelector | nindent 14 }}
          {{- end }}
      ports:
        {{- range $port := keys $target.ports | sortAlpha }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}

    # Postgres usage store (broker.usage.backend="postgres") -- allow the broker to
    # reach the Crunchy PGO postgres pods backing USAGE_POSTGRES_DSN (see values.yaml
    # broker.usage.postgres.networkPolicy for the namespace/cluster selection).
    {{- if eq .Values.broker.usage.backend "postgres" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.broker.usage.postgres.networkPolicy.namespace | default .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ .Values.broker.usage.postgres.networkPolicy.clusterName | quote }}
              postgres-operator.crunchydata.com/data: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}

    # Shared cross-replica state store (broker.sharedState) -- allow the broker
    # to reach the redis-protocol server selected by
    # broker.sharedState.networkPolicy: an ipBlock when `cidr` is set (managed
    # instance outside the cluster), otherwise a namespace/pod selector (an
    # empty namespaceSelector means the release namespace; an empty
    # podSelector allows any pod there).
    {{- if include "af-mcp-platform.sharedState.configured" . }}
    - to:
        {{- if .Values.broker.sharedState.networkPolicy.cidr }}
        {{- if not (has (ternary "IPv6" "IPv4" (contains ":" .Values.broker.sharedState.networkPolicy.cidr)) .Values.networkPolicy.ipFamilies) }}
        {{- fail (printf "broker.sharedState.networkPolicy.cidr %s is in an address family missing from networkPolicy.ipFamilies" .Values.broker.sharedState.networkPolicy.cidr) }}
        {{- end }}
        - ipBlock:
            cidr: {{ .Values.broker.sharedState.networkPolicy.cidr | quote }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              {{- if .Values.broker.sharedState.networkPolicy.namespaceSelector }}
              {{- toYaml .Values.broker.sharedState.networkPolicy.namespaceSelector | nindent 14 }}
              {{- else }}
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
              {{- end }}
          {{- if .Values.broker.sharedState.networkPolicy.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.broker.sharedState.networkPolicy.podSelector | nindent 14 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.broker.sharedState.networkPolicy.port }}
    {{- end }}
    {{- end }}

    # Anything else the broker must reach (networkPolicy.egress.extraEgress).
    {{- with $egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Portal network policy: allow ingress from networkPolicy.ingress.portal; no
# egress rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "af-mcp-platform.portal.fullname" . }}
  labels:
    {{- include "af-mcp-platform.portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "af-mcp-platform.portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or $ingress.portal.sources $ingress.portal.extraIngress }}
  ingress:
    {{- include "af-mcp-platform.netpol.sources" $ingress.portal.sources | nindent 4 }}
    {{- with $ingress.portal.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
