{{- if .Values.ingress.enabled }}
# This Ingress is the portalHost catch-all: every page route (public landing,
# authenticated app pages, static /_astro and /fonts assets) falls through to
# the portal Service here — auth for the authenticated pages is enforced
# client-side by Base.astro's getUser()-or-login() check, not at the ingress.
# /v1 and /mcp on this host are routed by ingress-portal-api.yaml instead,
# without any gate in front, because the portal SPA is its own OAuth public
# client (Authorization Code + PKCE) and sends the broker its own
# `aud=mcp-gateway` Bearer directly; the broker validates it the same way it
# validates any other caller's token. See #42 for the full design.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "af-mcp-platform.fullname" . }}-portal
  labels:
    {{- include "af-mcp-platform.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.portalHost | quote }}
      secretName: {{ .Values.ingress.tls.portalSecretName | quote }}
  {{- end }}
  rules:
    # Portal host — everything falls through to the portal Service here.
    # ingress-portal-api.yaml routes /v1/* and /mcp/* to the broker instead,
    # ahead of this rule via nginx's longest-prefix matching.
    #
    # IMPORTANT: any new portal page route MUST NOT start with /v1/ or /mcp/ —
    # those prefixes are reserved for the broker and would be silently
    # shadowed on this host.
    - host: {{ .Values.ingress.portalHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "af-mcp-platform.portal.fullname" . }}
                port:
                  name: http
{{- end }}
