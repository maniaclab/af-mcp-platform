apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "af-mcp-platform.broker.fullname" . }}
  labels:
    {{- include "af-mcp-platform.broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.broker.replicaCount }}
  selector:
    matchLabels:
      {{- include "af-mcp-platform.broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Trigger rolling update when ConfigMaps change
        checksum/config-policy: {{ include (print $.Template.BasePath "/configmap-policy.yaml") . | sha256sum }}
        checksum/config-services: {{ include (print $.Template.BasePath "/configmap-services.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "af-mcp-platform.broker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "af-mcp-platform.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        # Matches the numeric uid/gid the af-mcp user is created with in
        # Containerfile.broker (kubelet requires numeric ids, not names).
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ include "af-mcp-platform.broker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.broker.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            {{- include "af-mcp-platform.broker.env" . | nindent 12 }}
            # Confidential Keycloak client credentials (TOKEN_MINT_CLIENT_ID/
            # TOKEN_MINT_CLIENT_SECRET) the broker's own /v1/oauth/authorize
            # authenticates as when it stands in for an MCP client during the
            # OAuth discovery bootstrap flow (issue #140, api/mcp_oauth.py --
            # Settings.keycloak_login_client_id/_secret). Deployment-only, not
            # part of the shared af-mcp-platform.broker.env template: the
            # token-sweep CronJob's entrypoint (token_sweep.py) never imports
            # api/mcp_oauth.py, so there's no reason for its pod spec to carry
            # this credential -- Settings() tolerates it being absent there
            # (Settings._validate_mcp_oauth_config only requires
            # broker_state_key/broker_public_origin when this client id is
            # actually set, same "half-configured must fail loudly, absent is
            # a valid degraded state" shape as oauth21-direct's validation).
            # These env var names predate this purpose: issue #144 step 2a
            # replaced the RFC 8693 token-exchange design that originally
            # needed a confidential client here, leaving TOKEN_MINT_CLIENT_ID/
            # SECRET wired but unused until this repurposed them for a
            # different grant type (authorization_code instead of
            # token-exchange) rather than adding a second env var pair for
            # the same "confidential client + sealed secret" shape.
            {{- if .Values.broker.tokenMint.clientId }}
            - name: TOKEN_MINT_CLIENT_ID
              value: {{ .Values.broker.tokenMint.clientId | quote }}
            {{- end }}
            {{- if .Values.broker.tokenMint.existingClientSecretSecret }}
            - name: TOKEN_MINT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.tokenMint.existingClientSecretSecret | quote }}
                  key: token-mint-client-secret
            {{- end }}
            # AF Broker Identity Token signing key (issue #162) — mounted
            # from broker.identityToken.existingSigningKeySecret below and
            # pointed at via a file-path env var (never an inline env
            # value). Deployment-only, not part of the shared
            # af-mcp-platform.broker.env template: the token-sweep CronJob
            # never mints identity tokens, and the mounts these paths refer
            # to only exist on this pod spec. The broker's own startup
            # check refuses to boot when identityProviders has a
            # broker-issued entry and this is unset.
            {{- if .Values.broker.identityToken.existingSigningKeySecret }}
            - name: BROKER_SIGNING_KEY_FILE
              value: "/etc/af-mcp/identity-token/signing-key.pem"
            {{- end }}
            {{- if .Values.broker.identityToken.existingAdditionalPublicKeysSecret }}
            - name: BROKER_ADDITIONAL_PUBLIC_KEYS_DIR
              value: "/etc/af-mcp/identity-token-public-keys"
            {{- end }}
            {{- if .Values.broker.identityToken.issuer }}
            - name: BROKER_TOKEN_ISSUER
              value: {{ .Values.broker.identityToken.issuer | quote }}
            {{- end }}
            {{- if .Values.broker.identityToken.ttlSeconds }}
            - name: BROKER_TOKEN_TTL_SECONDS
              value: {{ .Values.broker.identityToken.ttlSeconds | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /etc/af-mcp/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: services
              mountPath: /etc/af-mcp/services.yaml
              subPath: services.yaml
              readOnly: true
            {{- if .Values.broker.homeDir.enabled }}
            - name: home-dir
              mountPath: {{ .Values.broker.homeDir.mountPath | quote }}
              readOnly: {{ .Values.broker.homeDir.readOnly }}
            {{- end }}
            {{- if .Values.broker.tmpfsProxy.enabled }}
            - name: proxy-tmpfs
              mountPath: {{ .Values.broker.tmpfsProxy.mountPath | quote }}
            {{- end }}
            {{- if .Values.broker.identityToken.existingSigningKeySecret }}
            - name: identity-token-signing-key
              mountPath: /etc/af-mcp/identity-token
              readOnly: true
            {{- end }}
            {{- if .Values.broker.identityToken.existingAdditionalPublicKeysSecret }}
            - name: identity-token-public-keys
              mountPath: /etc/af-mcp/identity-token-public-keys
              readOnly: true
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ include "af-mcp-platform.fullname" . }}-policy
        - name: services
          configMap:
            name: {{ include "af-mcp-platform.fullname" . }}-services
        {{- if .Values.broker.homeDir.enabled }}
        - name: home-dir
          {{- if eq .Values.broker.homeDir.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.broker.homeDir.claimName | quote }}
            readOnly: {{ .Values.broker.homeDir.readOnly }}
          {{- else if eq .Values.broker.homeDir.mode "csi" }}
          csi:
            driver: {{ .Values.broker.homeDir.csi.driver | quote }}
            {{- with .Values.broker.homeDir.csi.volumeAttributes }}
            volumeAttributes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else if eq .Values.broker.homeDir.mode "hostPath" }}
          # WARNING: hostPath is for local development only. Never use in production.
          hostPath:
            path: {{ .Values.broker.homeDir.hostPath | quote }}
            type: Directory
          {{- end }}
        {{- end }}
        {{- if .Values.broker.tmpfsProxy.enabled }}
        - name: proxy-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.broker.tmpfsProxy.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.broker.identityToken.existingSigningKeySecret }}
        - name: identity-token-signing-key
          secret:
            secretName: {{ .Values.broker.identityToken.existingSigningKeySecret | quote }}
        {{- end }}
        {{- if .Values.broker.identityToken.existingAdditionalPublicKeysSecret }}
        - name: identity-token-public-keys
          secret:
            secretName: {{ .Values.broker.identityToken.existingAdditionalPublicKeysSecret | quote }}
        {{- end }}
