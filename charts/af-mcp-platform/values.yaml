# Default values for af-mcp-platform.
# This is a YAML-formatted file. Declare variables to be passed into your templates.

image:
  registry: ghcr.io/maniaclab
  broker:
    repository: af-mcp-platform-broker
    # Defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent
  portal:
    repository: af-mcp-platform-portal
    # Defaults to .Chart.AppVersion when empty
    tag: ""
    pullPolicy: IfNotPresent

# List of imagePullSecrets to add to all pods (name references only)
imagePullSecrets: []
# - name: my-registry-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  annotations: {}

# RBAC (Role + RoleBinding) for the broker's ServiceAccount: it mints x509
# proxies via ephemeral k8s Jobs and needs to manage those Jobs/Pods.
rbac:
  create: true

# ---------------------------------------------------------------------------
# OIDC issuer — single source of truth shared by the broker and the portal
# ---------------------------------------------------------------------------
oidc:
  # e.g. "https://keycloak.example.com/realms/your-realm". Both the broker
  # (OIDC_ISSUER, JWKS + iss/aud/exp validation) and the portal
  # (config.json's oidc.issuer, Authorization Code + PKCE) validate/present
  # against this one realm — it must be the same realm for both, so it is
  # configured once here rather than as broker.oidc.issuer/portal.oidc.issuer
  # separately. Those used to have to be kept in sync by hand; letting them
  # drift meant the portal minted tokens whose `iss` the broker rejected,
  # presenting as "login works, every API call 401s" with nothing obviously
  # wrong in either config (issue #143). REQUIRED — set in your deploying
  # values overlay (e.g. a HelmRelease), there is no safe cross-institution
  # default. Left empty, the portal skips OIDC entirely and runs in
  # unauthenticated / dev-bypass mode (see docs/local-development.md); the
  # broker has no equivalent bypass, so an empty issuer fails its own
  # startup validation instead.
  issuer: ""

# ---------------------------------------------------------------------------
# Broker: FastAPI (/v1 REST) + FastMCP aggregator (/mcp) — same pod
# Trust tier (Elwood v5 / Shannon): infrastructure-tier — holds the
# identity-token signing key + Vault access; see docs/architecture.md
# "Trust tiers".
# ---------------------------------------------------------------------------
broker:
  replicaCount: 2

  # Name of the builtin gateway service (issue #240) -- the entry the registry
  # self-registers for the broker's own af_* methods (af_whoami, af_usage,
  # ...), used as its catalog identity and its audit/usage `mcp_service` label.
  # Empty means use the broker default (`gateway_service`). Override to align
  # with a facility's own service-naming convention; the reserved `af` prefix
  # and the af_* method wire-names are unaffected. Renaming it re-labels the
  # gateway's usage rows from the change forward -- migrate historical rows
  # separately if you want one continuous series.
  builtinServiceName: ""

  # Keycloak group whose members see and can use admin-only broker surfaces
  # (the Admin portal page, the usage-for-other-users view, maintenance
  # mode). Empty means no admin surface is reachable by anyone.
  adminGroup: ""

  # /mcp aggregator transport mode (issue #128). Streamable-HTTP sessions
  # are in-process state, so a stateful session (false) only survives an
  # unpinned load balancer routing its later requests to a *different*
  # replica if something in front of the broker provides session affinity
  # (e.g. an ingress hashing on client IP) -- the broker cannot see whether
  # that exists, so it can only warn, not refuse to start, when this is
  # false at replicaCount > 1. See docs/architecture.md for the trade-off
  # (this mode drops the standalone GET SSE stream used for
  # notifications/tools/list_changed and other server-initiated messages
  # outside an active tools/call).
  mcpStatelessHttp: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # Extra environment variables merged into the broker container.
  # These supplement the env vars derived from broker.oidc.* below.
  # Format: key: value (rendered as EnvVars with name/value pairs)
  env: {}
  # MY_EXTRA_VAR: "some-value"

  # OIDC configuration — rendered as env vars in the broker container. The
  # broker validates via JWKS + iss/aud/exp, all standard OIDC; any
  # OIDC-compliant issuer works, not just Keycloak. The issuer itself is the
  # top-level `oidc.issuer` above (shared with the portal); `audience` is
  # broker-specific — the *resource-server audience* the broker validates,
  # deliberately kept separate from portal.oidc.clientId and
  # broker.tokenMint.clientId (see the comment on portal.oidc.clientId
  # below).
  oidc:
    audience: "mcp-gateway"
    # Realm URL for the broker's server-to-server (back-channel) Keycloak
    # calls — JWKS, token endpoint, Admin REST API, brokered-token fetch —
    # independent of the top-level `oidc.issuer` used for `iss` claim
    # validation and browser-facing redirects. Leave empty to use
    # `oidc.issuer` for everything — the common case. Set this when the
    # issuer is only reachable by its externally-advertised hostname (it's
    # embedded in minted tokens' `iss`) but the broker itself runs in the
    # same cluster and should reach Keycloak via cluster-local DNS instead
    # of hairpinning back out through the public ingress (e.g.
    # `http://keycloak-prod.keycloak.svc.cluster.local:8080/realms/connect`).
    internalUrl: ""

  # Name of a pre-existing Secret providing the AF service token.
  # The Secret must contain a key named `af-service-token`.
  # Create this via SealedSecret externally; the chart does NOT create it.
  existingServiceTokenSecret: ""

  # Confidential Keycloak client the broker authenticates as (authorization_
  # code grant, PKCE) when it stands in for an MCP client during the OAuth
  # discovery bootstrap flow (issue #140, api/mcp_oauth.py --
  # Settings.keycloak_login_client_id/_secret): the broker's own
  # `/v1/oauth/authorize` redirects the browser to Keycloak using this
  # client, then exchanges the resulting code at Keycloak's token endpoint to
  # learn who logged in, before minting a PAT for the MCP client. This is the
  # same "confidential client + sealed secret" shape issue #144 step 2a's RFC
  # 8693 token-exchange design originally needed this client for (hence the
  # `tokenMint` name, kept rather than renamed to avoid an unnecessary
  # values-key churn) -- that design was replaced by broker-issued identity
  # PATs and left this client configured-but-unread until this flow
  # repurposed it, for a different grant type (authorization_code instead of
  # token-exchange) and without needing Standard Token Exchange permission.
  tokenMint:
    # Client id of the confidential client. Not a secret -- a plain value,
    # like portal.oidc.clientId above. Deliberately a separate client from
    # portal.oidc.clientId and broker.oidc.audience -- see the comment on
    # portal.oidc.clientId below for why.
    clientId: ""
    # Name of a pre-existing Secret providing the client secret.
    # The Secret must contain a key named `token-mint-client-secret`.
    # Create this via SealedSecret externally; the chart does NOT create it.
    existingClientSecretSecret: ""

  # Confidential Keycloak client the broker authenticates as (client_credentials
  # grant) to call the Admin REST API and resolve an authenticated principal's
  # *current* groups/uid/gid/unixname (issue #144 steps 2a/3) -- see
  # docs/auth.md's "Operator setup: the Keycloak admin service account"
  # section for the Keycloak-side setup (realm-management roles `view-users`
  # + `query-groups` ONLY -- a deliberate, narrowly-scoped privilege
  # increase, not a footnote). KEYCLOAK_ADMIN_CLIENT_ID/
  # KEYCLOAK_ADMIN_CLIENT_SECRET are each omitted when their source value
  # below is empty. As of issue #144 step 3 this is REQUIRED for every
  # deployment (JWT auth included, not just identity PATs): the broker
  # refuses to start with both unset, since the local-dev bypass this would
  # otherwise degrade to is never set via chart values (see the broker
  # section's own dev-bypass warning, if any, and docs/local-development.md).
  keycloakAdmin:
    # Client id of the confidential client. Not a secret -- a plain value.
    # Deliberately a separate client from tokenMint/oidc above -- same
    # "narrowest client for the narrowest job" reasoning as portal.oidc.clientId.
    clientId: ""
    # Name of a pre-existing Secret providing the client secret.
    # The Secret must contain a key named `keycloak-admin-client-secret`.
    # Create this via SealedSecret externally; the chart does NOT create it.
    existingClientSecretSecret: ""

  # Keycloak user-profile attribute keys `principal_directory.py`'s
  # KeycloakPrincipalDirectory reads a PAT-authenticated principal's POSIX
  # identity from, via the Admin REST API -- issue #148. Defaults match AF's
  # own profile attribute names. A facility whose POSIX identity is
  # LDAP-federated under different names (the common spelling is
  # uidNumber/gidNumber) overrides these rather than the broker hardcoding
  # AF's convention -- same reasoning as entitlements.group_permissions.
  # Unlike these, the JWT path is unaffected: a token's posix.uid/gid/unixname
  # claim shape is fixed by convention (Keycloak's mappers already normalize
  # whatever the underlying attribute is named into that shape) -- see
  # docs/auth.md.
  posixAttributes:
    uid: "uid"
    gid: "gid"
    unixname: "unixname"

  # Whether the PAT path (KeycloakPrincipalDirectory) matches a Keycloak
  # group by its full `path` (e.g. "/atlas/users") instead of its bare `name`
  # (e.g. "atlas") -- issue #148. False (bare name) matches AF's own Group
  # Membership mapper convention ("Full group path: OFF", see docs/auth.md)
  # and the JWT path's `groups` claim shape. A site whose mapper has "Full
  # group path" enabled must set this true too, or every PAT-authenticated
  # permission lookup silently returns nothing even though the equivalent
  # JWT path works fine.
  groupFullPath: false

  # NFS home directory access — required by the x509 legacy credential provider.
  homeDir:
    enabled: true
    # How the home directory volume is provided:
    #   pvc      — use an existing PersistentVolumeClaim (recommended for prod)
    #   csi      — inline CSI volume (e.g. NFS CSI driver)
    #   hostPath — host path directly (dev/testing only; not safe for prod)
    mode: pvc
    # Name of the PVC when mode=pvc
    claimName: "af-user-homes"
    mountPath: "/data/homes"
    # Host path to bind-mount when mode=hostPath (dev/testing only).
    hostPath: "/data/homes"
    readOnly: true
    # The root path inside the container where user homes are expected.
    # The broker uses this to construct per-user paths: {homeRoot}/{username}
    homeRoot: "/data/homes"
    # CSI-specific fields (only used when mode=csi)
    csi:
      driver: ""
      volumeAttributes: {}

  # Per-uid proxy tmpfs — scratch space for x509 proxy files.
  # Avoids writing grid proxies to the container overlay filesystem.
  tmpfsProxy:
    enabled: true
    mountPath: "/run/broker/proxies"
    sizeLimit: "64Mi"

  # Client ID Metadata Document (CIMD, draft-ietf-oauth-client-id-metadata-
  # document) served at /.well-known/cimd, for backend OAuth 2.1 authorization
  # servers to identify this broker without per-backend Dynamic Client
  # Registration. Empty defaults — no AF-specific leak in the public chart.
  # `redirect_uris` in the served document is derived from the oauth21-direct
  # entries in identityProviders below — no separate alias list to keep in
  # sync.
  cimd:
    clientName: ""

  # Canonical origin (scheme + host, no trailing slash, e.g.
  # "https://mcp-portal.af.uchicago.edu") for every externally-visible OAuth
  # 2.1 URL the broker constructs itself: the redirect_uri sent to a backend
  # AS at authorize/callback time, and every redirect_uris entry in the CIMD
  # document above. Must be the exact origin the portal SPA is served from —
  # the linking flow's nonce cookie is host-only, so authorize and callback
  # must resolve to the same origin regardless of which ingress host a given
  # request arrived through. Empty default — no AF-specific hardcode in the
  # public chart. Required (the broker refuses to start otherwise) whenever
  # identityProviders has an oauth21-direct entry.
  publicOrigin: ""

  # Identity providers — one entry per identity provider the broker can link
  # a user's account to, either Keycloak's stored-broker-token pattern
  # (type: keycloak-brokered, e.g. ATLAS IAM) or the broker acting as a
  # direct OAuth 2.1 client (type: oauth21-direct, e.g. rucio-mcp). `alias`
  # doubles as the portal-facing id on GET /v1/identities. Empty default —
  # no AF-specific providers in the public chart.
  #
  # Consolidates the former broker.oidc.idpAlias / broker.oauth21.providers /
  # broker.cimd.idpAliases / broker.identitiesLinkClientId — see
  # docs/adding-a-service.md for the migration.
  identityProviders: []
  # - type: keycloak-brokered
  #   alias: atlas-oidc
  #   displayName: "ATLAS IAM"
  #   enables: "VOMS proxy generation and grid certificate credential brokering"
  #   targets: ["rucio"]
  # - type: oauth21-direct
  #   alias: rucio-mcp-atlas
  #   targets: ["rucio-mcp-atlas"]
  #   authorizationEndpoint: "https://rucio-mcp.example/authorize"
  #   tokenEndpoint: "https://rucio-mcp.example/token"
  #   issuer: "https://rucio-mcp.example"
  #   scope: "openid profile email"
  #   displayName: "Rucio (ATLAS)"
  #   enables: "ATLAS Rucio operations via rucio-mcp"
  # - type: broker-issued
  #   alias: af-native
  #   displayName: "AF-native services"
  #   enables: "HTCondor and other AF-internal services"
  #   targets: ["condor-token-service"]
  #   # No per-target options here: each target's aud and POSIX requirement
  #   # are declared on its service entry (aggregator.services' `audience`
  #   # and `requires_posix`, issue #257), so every token property of a
  #   # service lives in one place.
  # - type: condor-token
  #   alias: condor
  #   displayName: "HTCondor"
  #   enables: "HTCondor job submission via condor-mcp"
  #   targets: ["condor-mcp"]
  #   # Base URL of the condor-token-service deployment (the broker appends
  #   # /v1/token). audience defaults to "condor-token-service".
  #   serviceUrl: "http://condor-token-service.condor-token.svc.cluster.local:8080"
  # - type: krb5-token
  #   alias: krb5
  #   displayName: "CERN Kerberos ticket"
  #   enables: "Kerberos-authenticated access via <some-downstream-service>"
  #   # No downstream aggregator.services consumer is defined yet (issue
  #   # #274) -- leave targets empty until one is chosen.
  #   targets: []
  #   # Base URL of the krb5-token-service deployment (the broker appends
  #   # /v1/mint). audience defaults to "krb5-token-service".
  #   serviceUrl: "http://krb5-token-service.krb5-token.svc.cluster.local:8080"
  # - type: x509
  #   alias: x509
  #   displayName: "Grid certificate (x509)"
  #   enables: "VOMS proxy minting for x509-authenticated services"
  #   # Trust tier: voms-token-service mode (serviceUrl set) keeps Job
  #   # minting out of the broker pod; the legacy Job-mint mode (serviceUrl
  #   # omitted) grants the broker pod rbac.create — the higher-trust
  #   # configuration. See docs/architecture.md "Trust tiers".
  #   # Every service wired with auth_type: x509 in aggregator.services must
  #   # be covered by an x509 entry's targets (and vice versa) — the broker
  #   # refuses to start on a mismatch, including the entry-less case (no
  #   # synthesized fallback). Requires
  #   # broker.identityToken.existingSigningKeySecret when serviceUrl (below)
  #   # is set; a keyless legacy entry (serviceUrl omitted) only warns.
  #   targets: ["ami"]
  #   # Base URL of the voms-token-service deployment (the broker appends
  #   # /v1/mint); requires the shared Vault connection
  #   # (broker.oauth21.tokenStore.vault). Omit serviceUrl for the legacy
  #   # ephemeral-Job mint path. Replaces the removed global
  #   # broker.env.VOMS_TOKEN_SERVICE_URL (breaking change — the env var is
  #   # no longer read). Multiple x509 entries with different
  #   # serviceUrl/voms are supported.
  #   serviceUrl: "http://voms-token-service.voms-token.svc.cluster.local:8080"
  #   # VOMS attribute set and proxy validity (HH:MM) forwarded on every
  #   # mint; audience must match the service's EXPECTED_AUDIENCE.
  #   voms: "atlas"
  #   valid: "192:00"
  #   audience: "voms-token-service"

  # AF Broker Identity Token (issue #162) — the broker's own RS256 signing
  # key for the short-TTL identity-assertion JWTs it mints for AF-native
  # backends (identityProviders type: broker-issued above). Downstream
  # consumers — condor-token-service (maniaclab/condor-token-service,
  # verifying aud=condor-token-service) and future AF-native backends like
  # jupyter-mcp — verify these tokens against the broker's own JWKS at
  # https://<ingress.mcpHost>/.well-known/jwks.json; no Keycloak is in this
  # path. Required (the broker refuses to start otherwise) whenever
  # identityProviders has a broker-issued entry. See docs/auth.md's
  # "AF Broker Identity Token" section for the token format and the key
  # rotation procedure.
  identityToken:
    # Name of a pre-existing Secret providing the RS256 private key PEM.
    # The Secret must contain a key named `signing-key.pem` (generate with
    # `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048`).
    # Create via SealedSecret externally; the chart does NOT create it.
    existingSigningKeySecret: ""
    # Optional pre-existing Secret of ADDITIONAL public key PEMs published
    # in the JWKS alongside the active key, for rotation overlap: publish
    # the successor key here before switching signing to it, and keep the
    # retiring key here until every token it signed has expired. Every
    # Secret key named `*.pem` is published; other names are ignored.
    existingAdditionalPublicKeysSecret: ""
    # `iss` claim minted into every token. Empty means "use
    # broker.publicOrigin" — check that value before relying on the
    # fallback: at AF, publicOrigin is the PORTAL origin while consumers
    # verify iss against the mcp origin serving the JWKS, so this must be
    # set explicitly (e.g. "https://mcp.af.uchicago.edu").
    issuer: ""
    # Token TTL in seconds. Empty means the broker default (600). Keep it
    # comfortably above the credential layer's 300s min-remaining floor —
    # see the broker's BROKER_TOKEN_TTL_SECONDS comment.
    ttlSeconds: ""

  # OAuth 2.1 credential-brokering infrastructure shared by every
  # oauth21-direct entry in identityProviders above.
  oauth21:
    # Name of a pre-existing Secret providing the Fernet key (urlsafe-
    # base64-encoded 32 bytes) that encrypts the OAuth 2.1 linking flow's
    # `state` token. The Secret must contain a key named `broker-state-key`.
    # Required (non-empty) whenever identityProviders has an oauth21-direct
    # entry. Create via SealedSecret externally; the chart does NOT create it.
    existingStateKeySecret: ""
    # `iss`/`aud` self-reference embedded in the state token. Empty means
    # "use oidc.issuer".
    stateIssuer: ""

    # Where OAuth 2.1 credentials (above) are persisted. "in-memory" is
    # single-replica and lost on restart; "vault" persists to a Vault/OpenBao
    # KV-v2 mount via the broker's own ServiceAccount, authenticated through
    # Vault's Kubernetes auth method. Vault/OpenBao itself is BYO — this
    # chart only consumes an existing instance, it does not deploy one.
    tokenStore:
      backend: "in-memory"  # or "vault"
      vault:
        # Vault HTTP API base URL, e.g. https://vault.example.com. Required
        # when backend="vault".
        addr: ""
        # Vault auth mount point for the Kubernetes auth method.
        authMount: "kubernetes"
        # Vault role the broker's ServiceAccount JWT is exchanged against.
        # Required when backend="vault".
        authRole: ""
        # Vault KV-v2 secrets engine mount point.
        kvMount: "secret"
        # Path prefix under the KV mount where per-subject/alias credentials
        # are stored.
        kvPathPrefix: "mcp/tokens"

  # Durable registry backing the manual bearer-token bootstrap flow
  # (POST/GET/DELETE /v1/tokens, issue #115/#116). "in-memory" is
  # single-replica and lost on restart; "vault" persists to the same
  # Vault/OpenBao instance as oauth21.tokenStore.vault above (one shared
  # connection — addr/authMount/authRole/kvMount are not repeated here),
  # under a separate kvPathPrefix so the two Vault-backed stores never
  # collide under the same kvMount.
  tokenRegistry:
    backend: "in-memory"  # or "vault"
    # Path prefix under oauth21.tokenStore.vault.kvMount where token-registry
    # records are stored. Only meaningful when backend="vault".
    kvPathPrefix: "mcp/token-registry"

  # Persists the principal cache (issue #144 step 2b) -- last-known
  # groups/uid/gid/unixname/email for identity-PAT-authenticated principals
  # -- so a broker restart during a Keycloak outage doesn't fail closed for
  # every PAT-authenticated caller the instant a replica comes back up.
  # "in-memory" is single-replica and lost on restart (fine for dev/testing,
  # and the pre-existing behavior before this setting existed); "vault"
  # persists to the same Vault/OpenBao instance as oauth21.tokenStore.vault
  # above (one shared connection), under a separate kvPathPrefix so all
  # three Vault-backed stores never collide under the same kvMount. See
  # docs/auth.md's "Authorization is an attribute of the principal, not the
  # token" section.
  principalCache:
    backend: "in-memory"  # or "vault"
    # Path prefix under oauth21.tokenStore.vault.kvMount where persisted
    # principal-cache records are stored. Only meaningful when backend="vault".
    kvPathPrefix: "mcp/principal-cache"

  # Transport carrying success/error audit records from the tool-call hot
  # path to the metering worker that measures and writes them (broker
  # audit/pipeline.py). Only "in-process" (a bounded in-process queue plus a
  # background worker) exists today; the broker fails closed at startup on
  # any unknown value, so never set a backend before its implementation
  # ships. Metering is best-effort; audit records are authoritative.
  metering:
    backend: "in-process"

  # Per-user usage accounting (broker usage/) -- the per-(day, service,
  # tool, outcome) aggregates behind GET /v1/usage and the portal's usage
  # card. "in-memory" is single-replica and lost on restart (fine for dev
  # and small facilities that treat usage as a convenience view; the audit
  # log stays authoritative either way); "postgres" persists events via
  # asyncpg. Postgres itself is BYO -- this chart only consumes an existing
  # instance, it does not deploy one.
  usage:
    backend: "in-memory"  # or "postgres"
    postgres:
      # Secret carrying the asyncpg DSN, rendered as USAGE_POSTGRES_DSN via
      # secretKeyRef only when backend="postgres". With Crunchy PGO the
      # operator generates a `<cluster>-pguser-<user>` secret whose `uri`
      # key is exactly this DSN -- point `name` at that secret and leave
      # `key` as "uri".
      existingSecret:
        name: ""
        key: "uri"
      # Selects the postgres pods for the broker's NetworkPolicy egress rule
      # (rendered only when backend="postgres" and networkPolicy.enabled):
      # pods labeled postgres-operator.crunchydata.com/cluster=<clusterName>
      # and postgres-operator.crunchydata.com/data=postgres in <namespace>
      # (empty = the release namespace), port 5432.
      networkPolicy:
        namespace: ""
        clusterName: ""

  # Broker-wide maintenance mode: only admins get through /v1 and /mcp while
  # enabled. Must be visible to every replica consistently -- "in-memory"
  # only ever affects the one replica that handled the toggle request (the
  # broker warns loudly at startup if this is selected alongside
  # replicaCount > 1); "vault" and "postgres" propagate to every replica.
  maintenanceMode:
    backend: "in-memory"  # or "vault" or "postgres"
    # Path prefix under oauth21.tokenStore.vault.kvMount where the
    # maintenance-mode record is stored. Only meaningful when backend="vault".
    kvPathPrefix: "mcp/maintenance-mode"
    postgres:
      # Secret carrying the asyncpg DSN, rendered as MAINTENANCE_MODE_POSTGRES_DSN
      # via secretKeyRef only when backend="postgres" and this is set. With Crunchy
      # PGO the operator generates a `<cluster>-pguser-<user>` secret whose `uri`
      # key is exactly this DSN -- point `name` at that secret and leave `key` as
      # "uri", same convention as broker.usage.postgres.existingSecret above.
      # Optional: leave unset to reuse broker.usage.postgres's DSN instead (both
      # point at the same database by default; Settings.
      # maintenance_mode_effective_postgres_dsn falls back to it) -- set only if
      # maintenance mode should use a genuinely different database than the usage
      # store. CAVEAT: unlike broker.usage.postgres, there is no
      # maintenanceMode.postgres.networkPolicy sub-block -- the broker's
      # NetworkPolicy egress rule for postgres is wired only off
      # broker.usage.postgres.networkPolicy. A separate-database setup here is
      # unreachable when networkPolicy.enabled=true (only the DSN-fallback case,
      # which shares usage's already-open egress rule, is fully supported).
      existingSecret:
        name: ""
        key: "uri"

  # OpenTelemetry trace EMISSION (broker tracing.py, observability roadmap
  # PR D). The broker is an emitter only -- no trace backend is shipped or
  # assumed; point `endpoint` at any OTLP/HTTP collector. Disabled (the
  # default) renders nothing: no env vars, no NetworkPolicy egress, and the
  # broker installs no SDK tracer provider (every OTel call no-ops).
  tracing:
    enabled: false
    # OTLP/HTTP collector base URL, rendered as OTEL_EXPORTER_OTLP_ENDPOINT
    # (the SDK appends the /v1/traces signal path itself), e.g.
    # http://otel-collector.observability:4318
    endpoint: ""
    # Head sampling ratio in [0, 1]. When set, rendered as
    # OTEL_TRACES_SAMPLER=parentbased_traceidratio with
    # OTEL_TRACES_SAMPLER_ARG=<ratio>; empty means the SDK default
    # (parentbased_always_on, i.e. every trace -- equivalent to 1.0), fine
    # at tool-call volumes.
    sampleRatio: ""
    # Selects the collector for the broker's NetworkPolicy egress rule
    # (rendered only when enabled and networkPolicy.enabled) -- same shape
    # as broker.usage.postgres.networkPolicy above. namespaceSelector /
    # podSelector are matchLabels maps: an empty namespaceSelector selects
    # the release namespace; an empty podSelector allows any pod there.
    networkPolicy:
      namespaceSelector: {}
      podSelector: {}
      port: 4318

# ---------------------------------------------------------------------------
# Token sweep: periodic janitor for the Vault-backed token registry above
# (broker.tokenRegistry.backend="vault"). Removes registry entries whose
# expires_at is more than tokenSweep.graceSeconds in the past and prunes the
# revoked-jtis denylist of anything that's now expired regardless of
# revocation — see broker/src/af_mcp_broker/token_registry.py's
# sweep_expired() docstring. Not needed (and refuses to run, exit code 2) for
# the in-memory registry backend, which already self-sweeps inline.
# ---------------------------------------------------------------------------
tokenSweep:
  # Deploys the CronJob below. Only useful when
  # broker.tokenRegistry.backend="vault" — the CronJob's container refuses
  # to run otherwise (see token_sweep.py).
  enabled: false
  # Standard cron syntax, evaluated in the cluster's local time zone.
  schedule: "17 3 * * *"
  # Grace window (seconds) a record is kept after its expires_at passes,
  # before the sweep removes it — see broker's TOKEN_SWEEP_GRACE_SECONDS
  # (config.py). Empty means "use the broker's own default" (7 days).
  graceSeconds: ""

# ---------------------------------------------------------------------------
# Aggregator: FastMCP service registry
# ---------------------------------------------------------------------------
aggregator:
  # List of ServiceSpec objects passed verbatim into services.yaml.
  # Each entry should follow the FastMCP ServiceSpec schema, e.g.:
  #   - name: my-tool
  #     transport: sse
  #     url: http://my-tool-svc:8000/mcp
  #     apply_namespace: true
  #     tools_cache_ttl: 300  # optional; 0 disables the by-name lookup cache
  #                           # for a service whose tool list personalizes
  #                           # per caller -- see docs/adding-a-service.md
  # For x509/broker-issued (AF-native) services, two more fields carry the
  # token contract (issue #257):
  #     audience: my-tool-mcp   # the exact `aud` the backend validates the AF
  #                             # Broker Identity Token against. Omit ⇒ equals
  #                             # `name`. Set it explicitly so you can rename
  #                             # `name` (registry/catalog/audit identity)
  #                             # WITHOUT moving the aud every backend checks --
  #                             # renaming `name` alone silently re-points the
  #                             # contract and 401s the backend. Must match the
  #                             # backend deployment's own expected-audience.
  #     requires_posix: true    # stamp the caller's uid/gid/unixname into this
  #                             # backend's token (and 404 if the caller has
  #                             # none). Only for backends that act AS the POSIX
  #                             # user (home-dir access, launching as the user);
  #                             # omit for metadata backends (least privilege).
  # apply_namespace defaults to true (mounts tools as <prefix>_<toolname>) to
  # prevent cross-service tool-name collisions; set false only for a service
  # whose tools are already self-prefixed at the source, and only when no
  # other configured service can advertise an overlapping name -- otherwise
  # one silently shadows the other. See docs/adding-a-service.md.
  # Each registered service's trust tier (Elwood v5 / Shannon) is declared
  # alongside its deployment manifests in the GitOps repo;
  # required_permission: __none__ is only for user-tier read-only services.
  services: []

# ---------------------------------------------------------------------------
# Entitlements / policy
# ---------------------------------------------------------------------------
entitlements:
  # The rendered policy.yaml is mounted at /etc/af-mcp/policy.yaml.
  # Leaving group_permissions unset (the default, `{}` here) renders the
  # UChicago ATLAS AF's own Keycloak group names -- atlas, cms, dune,
  # escape, af-admins -- see templates/configmap-policy.yaml's `else`
  # branch for the exact mapping. That is a convenience default for *that
  # one deployment* and a template for what an overlay looks like, NOT a
  # generic default: group names are inherently site-specific (they come
  # from the deployer's own Keycloak realm), so a same-named group in
  # another realm could mean something else entirely. If you are deploying
  # this chart for any analysis facility OTHER than the UChicago AF, you
  # MUST override group_permissions below with your own Keycloak group
  # names, or every service whose `required_permission` (services.yaml)
  # isn't __none__ becomes unreachable by everyone -- the broker refuses to
  # start, naming the offending service and permission, rather than
  # deploying silently broken (issue #125). See docs/auth.md's "Group-to-
  # Permission Mapping Example" section for both the UChicago mapping and a
  # worked example for a non-ATLAS site.
  # Which permission a service target requires is declared by
  # `required_permission` in services.yaml (aggregator.services), not here --
  # see issue #60.
  group_permissions: {}
  # group_permissions:
  #   my-experiment-users: [read_data, read_metadata, submit_jobs]
  target_action_types: {}
  # target_action_types:
  #   condor-mcp:
  #     "submit_*": state_change

# ---------------------------------------------------------------------------
# Portal: static Astro site
# ---------------------------------------------------------------------------
portal:
  replicaCount: 2

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # OIDC config for the portal SPA's own OAuth public client (Authorization
  # Code + PKCE against top-level `oidc.issuer`; see docs/auth.md and #42).
  # Delivered to the browser at runtime via /config.json
  # (configmap-portal-config.yaml) rather than baked into the image at build
  # time, so one built image works against any realm/client/institution.
  oidc:
    # e.g. "your-portal-client" — a public client, Client Authentication OFF,
    # Standard flow ON, PKCE S256 required. REQUIRED — set in your deploying
    # values overlay (e.g. a HelmRelease), there is no safe cross-institution
    # default.
    #
    # Deliberately NOT unified with broker.oidc.audience or
    # broker.tokenMint.clientId, even though all three are "some kind of
    # OIDC client id/value" in the same realm: this is a *public* client
    # doing browser-side Authorization Code + PKCE and cannot hold a secret;
    # broker.oidc.audience is not a client at all, it's the *resource-server
    # audience* the broker validates incoming tokens against; and
    # broker.tokenMint.clientId (#142) names a *confidential* client because
    # RFC 8693 token exchange is a privileged operation — only the broker
    # may perform it. Merging any pair of these would blur that boundary:
    # e.g. folding tokenMint into this public client would let any holder of
    # a browser access token mint tokens directly against Keycloak, bypassing
    # the broker's registry, rate limiting, and revocation entirely.
    clientId: ""
    # openid/profile/email are OIDC-standard; append your audience-mapping
    # client scope so the access token carries the broker's expected `aud`
    # (must match broker.oidc.audience above).
    scope: "openid profile email"

    # Extra static query params forwarded to Keycloak's authorize endpoint
    # on login (auth.ts's login()). Empty by default. Set e.g.
    # `kc_idp_hint: "oidc"` to skip Keycloak's own login page in favor of a
    # specific upstream IdP configured in your realm.
    extraAuthorizeParams: {}

  # Origin the SPA calls for the broker's /v1 and /mcp paths, and what the
  # portal's CSP connect-src allows. REQUIRED — e.g. "https://mcp.example.com".
  # Same-origin (ingress.portalHost) also works if you'd rather not expose
  # mcpHost to the browser; set this to that origin either way since it's
  # also used to build the CSP header.
  brokerOrigin: ""

  # Per-deployment site identity, delivered via /config.json exactly like
  # oidc/brokerOrigin above and patched into the DOM on mount (see
  # portal/src/lib/branding.ts) — this is a static build, so it can't be
  # baked in at build time. Leave any field empty to keep that field's
  # built-in default (the original AF branding, unchanged from before this
  # existed): "AF / MCP" / "AF MCP Platform" / "ATLAS Analysis Facility".
  branding:
    # Short mark in the sidebar/topbar logo, e.g. "UChicago AF Ops".
    shortName: ""
    # Full name, used in the logo links' aria-label ("<fullName> home").
    fullName: ""
    # Facility/institution name shown in the overview hero and footer.
    facilityName: ""

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # FQDN for the broker (REST + MCP) endpoints
  mcpHost: mcp.af.uchicago.edu
  # FQDN for the portal (static site)
  portalHost: mcp-portal.af.uchicago.edu
  # Extra annotations merged onto the Ingress.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # Secret name for the broker TLS certificate (managed by cert-manager)
    mcpSecretName: letsencrypt-generated-af-mcp
    # Secret name for the portal TLS certificate (managed by cert-manager)
    portalSecretName: letsencrypt-generated-af-mcp-portal

# ---------------------------------------------------------------------------
# Network Policy
# ---------------------------------------------------------------------------
networkPolicy:
  # When enabled, deny-all ingress to broker except from ingress controller;
  # restrict broker egress to DNS, Keycloak, ATLAS IAM, services, and Prometheus.
  enabled: true

  broker:
    # Ports the broker is allowed to reach on in-namespace MCP services.
    # Add a port here when introducing a service MCP server that listens on a
    # non-default port (e.g., rucio-mcp on 9000). Defaults cover the two most
    # common backend port choices; extend as needed.
    servicePorts:
      - 8000
      - 8080

# ---------------------------------------------------------------------------
# Prometheus ServiceMonitor
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  interval: 30s
  # Namespace for the ServiceMonitor resource; defaults to the release namespace.
  namespace: ""

# ---------------------------------------------------------------------------
# Grafana Dashboard ConfigMap
# ---------------------------------------------------------------------------
grafanaDashboard:
  enabled: true
  # Namespace where the ConfigMap is deployed.
  # The Grafana sidecar (label grafana_dashboard: "1") watches this namespace.
  namespace: prom
