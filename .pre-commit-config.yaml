exclude: ^.agents/|.claude

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  # The af-mcp-builder skill bundles a generated copy of docs/mcp-design.md
  # (the canonical text); fail when the copy has drifted.
  - repo: local
    hooks:
      - id: sync-skill-guide
        name: skill guide copy matches docs/mcp-design.md
        entry: python3 scripts/sync-skill-guide.py --check
        language: system
        files: ^(docs/mcp-design\.md|skills/af-mcp-builder/references/mcp-design\.md|scripts/sync-skill-guide\.py)$
        pass_filenames: false

  # ruff and mypy are run via `pixi run lint`/`pixi run typecheck` in CI (see
  # ci.yaml), which pin versions in pixi.toml — that's the single source of
  # truth for those two tools, so they are intentionally not duplicated here.

  # helm/chart-testing ships no .pre-commit-hooks.yaml, so it cannot be used
  # as a pre-commit hook; chart linting is handled by chart-lint.yaml instead.
