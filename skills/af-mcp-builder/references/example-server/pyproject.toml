[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelf-mcp"
version = "0.0.0"
description = "Reference MCP server for the AF MCP platform (see ARCHITECTURE.md)"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.0.4,<5",
  "httpx2>=2.5.0,<3",
  "pyjwt[crypto]>=2.8",
  # Spans are exported only when OTEL_EXPORTER_OTLP_ENDPOINT is set (L4).
  "opentelemetry-sdk>=1.44",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["shelf_mcp"]

[tool.pytest.ini_options]
# The tests sit next to the package; no install is needed to run them.
asyncio_mode = "strict"
