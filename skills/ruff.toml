# Same ruleset as the broker; the skills' scripts declare requires-python >=3.10
# in their PEP 723 header, so the target is lower, and their tests are not
# packaged code.
extend = "../broker/pyproject.toml"
target-version = "py310"
# Eval fixtures are deliberately non-compliant servers that the skill is tested on.
extend-exclude = ["af-mcp-builder/evals/fixtures"]

[lint.per-file-ignores]
# Mirrors the broker's tests/** ignores (see broker/pyproject.toml): asserts,
# fake secrets, subprocess-launched fixture servers, and positional booleans
# in test helpers (FBT003 also covers calls to those helpers).
"**/tests/**" = ["ARG", "FBT", "S101", "S105", "S106", "S603", "S607"]
# The audit script is a CLI: it prints its report and exits with its status,
# and it probes the http(s) MCP server URL the operator passes on the command
# line, so S310's url-scheme audit does not apply.
"**/scripts/*.py" = ["T20", "S310"]
