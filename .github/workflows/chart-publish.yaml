name: Publish chart

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Package and push chart to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the chart to ghcr.io/maniaclab/charts
      id-token: write  # sign the provenance attestations with the workflow's OIDC identity
      attestations: write  # store the provenance attestations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.19.5"

      # The registry version comes from Chart.yaml, so a tag that disagrees
      # with it must stop the release before anything is pushed.
      - name: Check the tag matches Chart.yaml
        run: python3 scripts/check-chart-version.py "$GITHUB_REF_NAME" charts/af-mcp-platform/Chart.yaml

      # Same lint as chart-lint.yaml; ci/test-values.yaml supplies the values
      # the chart requires and has no default for.
      - name: helm lint
        run: helm lint charts/af-mcp-platform -f charts/af-mcp-platform/ci/test-values.yaml

      - name: helm package
        run: helm package charts/af-mcp-platform --destination "$RUNNER_TEMP/chart"

      - name: Login to ghcr.io
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # helm registry login writes helm's own credential file; the registry
      # attestation below (push-to-registry) reads Docker's credential store,
      # so log in there too, as docker.yaml does for the images.
      - name: Login to ghcr.io for the attestation
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes ghcr.io/maniaclab/charts/af-mcp-platform:<version>.
      # helm prints the pushed manifest's digest ("Digest: sha256:..."); the
      # OCI attestation below needs it.
      - name: helm push
        id: push
        run: |
          helm push "$RUNNER_TEMP"/chart/af-mcp-platform-*.tgz oci://ghcr.io/maniaclab/charts 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/helm-push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in helm push output" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Provenance for the packaged .tgz (verify the file from `helm pull`).
      - name: Attest chart package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/chart/af-mcp-platform-*.tgz

      # Provenance for the registry artifact, pushed next to it so
      # `gh attestation verify oci://...` finds it. create-storage-record is
      # off because it needs the extra artifact-metadata: write permission.
      - name: Attest chart registry artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maniaclab/charts/af-mcp-platform
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
