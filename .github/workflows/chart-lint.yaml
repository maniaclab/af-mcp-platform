name: Chart lint

on:
  pull_request:
    paths:
      - "charts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  chart-lint:
    name: Helm lint + template + ct lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # chart-testing needs full history to detect changed charts
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.19.5"

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # portal.oidc.* and portal.brokerOrigin are `required` (no safe
      # cross-institution default, see values.yaml) — ci/test-values.yaml
      # supplies placeholder values so lint/template can render.
      - name: helm lint
        run: helm lint charts/af-mcp-platform -f charts/af-mcp-platform/ci/test-values.yaml

      - name: helm template (dry-run)
        run: |
          helm template af-mcp-platform charts/af-mcp-platform \
            --debug \
            -f charts/af-mcp-platform/ci/test-values.yaml \
            --set image.broker.tag=sha-test \
            --set image.portal.tag=sha-test

      # ct lint / helm template above only confirm the chart renders without
      # erroring for ci/krb5-vault-values.yaml's shape of values -- neither
      # one asserts that VAULT_ADDR actually lands in the rendered output.
      # This step is the real content assertion for the krb5-token-implies-
      # Vault gating (af-mcp-platform.identityProvidersNeedVault in
      # _helpers.tpl): it fails the build if VAULT_ADDR is silently missing.
      - name: Verify krb5-token-only Vault rendering actually includes VAULT_ADDR
        run: |
          helm template af-mcp-platform charts/af-mcp-platform \
            -f charts/af-mcp-platform/ci/krb5-vault-values.yaml \
            --set image.broker.tag=sha-test \
            --set image.portal.tag=sha-test \
            | grep -q 'name: VAULT_ADDR'

      - name: ct lint
        run: ct lint --target-branch "$DEFAULT_BRANCH" --check-version-increment=false
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
